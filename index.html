<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>EcoOils Mentari — HSSE Induction</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');
:root{
  --green:#2F8F52; --green-dark:#1F6B3B; --green-light:#E7F3EC;
  --gold:#F5C518; --gold-dark:#D9A900; --ink:#20241F; --bg:#FFFFFF;
  --card:#F7F9F6; --line:#E1E6DD; --danger:#D6451A; --danger-light:#FBE6DC;
  --muted:#6B7280; --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;overscroll-behavior-y:contain;}
body{background:#EFF2EC;color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding-bottom:40px;}
@media (prefers-reduced-motion: reduce){*{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}}
.topbar{width:100%;background:var(--bg);padding:14px 20px 14px;border-bottom:5px solid var(--gold);position:relative;}
.topbar-inner{max-width:480px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;}
.logo-img{height:42px;object-fit:contain;}
.topbar h1{font-family:'Poppins',sans-serif;font-weight:700;font-size:19px;margin:2px 0 0;text-align:center;}
.topbar .sub{font-size:12px;color:var(--muted);text-align:center;}
.langtoggle{position:absolute;top:14px;right:16px;display:flex;border:1.5px solid var(--line);border-radius:20px;overflow:hidden;}
.langtoggle button{border:none;background:var(--card);color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;padding:6px 10px;cursor:pointer;}
.langtoggle button.active{background:var(--green);color:#fff;}
.progress-wrap{width:100%;max-width:480px;padding:14px 20px 0;}
.progress-track{height:8px;border-radius:5px;background:#DCE3D8;overflow:hidden;}
.progress-fill{height:100%;width:2%;background:var(--green);transition:width .4s cubic-bezier(.4,0,.2,1);}
.progress-text{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);margin-top:5px;text-align:right;}
.stage{width:100%;max-width:480px;padding:18px 20px;}
.card{background:var(--bg);border-radius:var(--radius);border:1px solid var(--line);box-shadow:0 16px 34px -14px rgba(20,30,20,0.25);overflow:hidden;}
.panel{padding:22px;max-height:62vh;overflow-y:auto;}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--green-dark);letter-spacing:0.04em;text-transform:uppercase;margin-bottom:6px;}
.panel h2{font-family:'Poppins',sans-serif;font-weight:700;font-size:20px;margin:0 0 10px;color:var(--ink);}
.panel h3{font-family:'Poppins',sans-serif;font-weight:700;font-size:14.5px;margin:14px 0 6px;color:var(--green-dark);}
.panel p.desc{color:var(--muted);font-size:13.5px;line-height:1.55;margin:0 0 12px;}
.rule-pill{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:10px;margin-bottom:10px;color:#fff;font-family:'Poppins',sans-serif;font-weight:600;font-size:14px;}
.rule-pill b{font-weight:800;margin-right:4px;}
.rule-pill.p1{background:#3E7BC4;} .rule-pill.p2{background:#2FA88A;} .rule-pill.p3{background:#5FA83C;}
ul.rules{margin:0 0 4px;padding-left:0;list-style:none;}
ul.rules li{position:relative;padding:7px 0 7px 24px;font-size:13.5px;line-height:1.5;border-bottom:1px solid var(--line);}
ul.rules li:last-child{border-bottom:none;}
ul.rules li::before{content:"✓";position:absolute;left:0;top:7px;color:var(--green);font-weight:700;font-size:12px;}
ul.rules li.warn::before{content:"✕";color:var(--danger);}
.icon-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.icon-item{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:10px 8px;display:flex;gap:8px;align-items:flex-start;font-size:12px;line-height:1.35;}
.icon-item svg{width:20px;height:20px;flex:0 0 auto;margin-top:1px;}
.icon-item.pos svg{stroke:var(--green);} .icon-item.neg svg{stroke:var(--danger);} .icon-item.info svg{stroke:#3E7BC4;}
.lsr-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px;}
.lsr-item{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:10px 8px;text-align:center;font-size:12px;font-weight:600;color:var(--green-dark);line-height:1.3;}
.lsr-icon-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:10px 0 16px;}
.lsr-icon-tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 6px;text-align:center;}
.lsr-icon-tile svg,.lsr-icon-tile img{width:34px;height:34px;stroke:var(--green);margin-bottom:6px;}
.lsr-icon-tile span{display:block;font-size:11px;font-weight:600;color:var(--green-dark);line-height:1.25;}
.lsr-page-icon{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:10px;overflow:hidden;}
.lsr-page-icon svg,.lsr-page-icon img{width:64px;height:64px;stroke:var(--green-dark);}
.lsr-icon-img{aspect-ratio:1/1;width:100%;height:auto;display:block;object-fit:contain;flex-shrink:0;}
.confirm-gate{display:flex;gap:10px;align-items:flex-start;background:var(--green-light);border:1px solid #CFE7D8;border-radius:10px;padding:12px 14px;margin-top:14px;font-size:13px;line-height:1.4;color:var(--green-dark);cursor:pointer;}
.confirm-gate input{margin-top:2px;width:16px;height:16px;flex:0 0 auto;}
.lsr-rewatch-links{display:flex;gap:10px;margin:6px 0 4px;}
.lsr-rewatch-link{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 6px;text-decoration:none;}
.lsr-rewatch-icon{width:32px;height:32px;display:block;border-radius:50%;overflow:hidden;}
.lsr-rewatch-icon svg,.lsr-rewatch-icon img{width:32px;height:32px;stroke:var(--green);}
.lsr-rewatch-link span:last-child{font-size:11px;font-weight:600;color:var(--green-dark);text-align:center;}
.iogp-box{background:#EEF5FC;border:1px solid #C9DDF2;border-left:5px solid #0B5CAD;border-radius:9px;padding:12px 13px;margin:12px 0;}
.iogp-tag{font-family:'Poppins',sans-serif;font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:#0B5CAD;margin-bottom:4px;}
.iogp-rule{font-family:'Poppins',sans-serif;font-weight:700;font-size:14.5px;color:#0B5CAD;line-height:1.35;margin-bottom:6px;}
.iogp-box ul{margin:0;padding-left:20px;}.iogp-box li{margin:5px 0;font-size:13.5px;line-height:1.45;}.iogp-box ul ul{margin:3px 0 4px;list-style:'– ';padding-left:18px;}
.lesson-box{background:#FFF8DB;border:1px solid #F0DC8A;border-left:5px solid var(--gold-dark);border-radius:9px;padding:11px 12px;font-size:12.5px;color:#5C4A00;margin-top:12px;line-height:1.45;}
.lesson-box b{display:block;font-family:'Poppins',sans-serif;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:#8A6D00;margin-bottom:3px;}
.zt-box{background:var(--danger-light);border:1px solid #F2C2AC;border-radius:9px;padding:11px 12px;font-size:12.5px;color:#7A2A0F;font-weight:600;margin-top:12px;line-height:1.4;}
.video-links{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
.video-links a{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;text-decoration:none;color:var(--ink);font-size:12.5px;font-weight:600;background:var(--card);}
.video-links a svg{width:16px;height:16px;stroke:var(--danger);flex:0 0 auto;}
.contact-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
.contact-row:last-child{border-bottom:none;}
.contact-row .name{font-weight:600;} .contact-row .num{font-family:'IBM Plex Mono',monospace;color:var(--green-dark);text-align:right;}
.contact-group{font-family:'Poppins',sans-serif;font-weight:700;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.03em;margin:12px 0 4px;}
.contact-group:first-child{margin-top:0;}
.dl-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:11px;margin-top:14px;border-radius:8px;border:1.5px dashed var(--green);background:var(--green-light);color:var(--green-dark);font-family:'Poppins',sans-serif;font-weight:700;font-size:13px;cursor:pointer;}
.field{margin-bottom:14px;}
.field label{display:block;font-family:'Poppins',sans-serif;font-weight:600;font-size:12px;letter-spacing:0.01em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}
.field label .req{color:var(--danger);font-size:10px;margin-left:3px;vertical-align:top;}
.required-note{font-size:11px;color:var(--danger);margin:2px 0 14px;font-weight:600;}
.field input, .field select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);font-family:'Inter',sans-serif;font-size:15px;color:var(--ink);}
.field input:focus, .field select:focus, button:focus-visible, .opt:focus-visible{outline:3px solid var(--gold);outline-offset:1px;border-color:var(--green);}
.checkbadge{display:inline-flex;align-items:center;gap:6px;background:var(--green-light);color:var(--green-dark);font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;padding:4px 9px;border-radius:20px;margin-bottom:10px;}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);font-family:'Inter',sans-serif;font-size:13.5px;color:var(--ink);cursor:pointer;transition:border-color .15s;}
.opt:hover{border-color:var(--green);}
.opt.correct{background:var(--green-light);border-color:var(--green);color:var(--green-dark);}
.opt.wrong{background:var(--danger-light);border-color:var(--danger);color:#7A2A0F;}
.opt.disabled{pointer-events:none;}
.feedback{font-size:12.5px;padding:9px 12px;border-radius:8px;margin-top:4px;line-height:1.4;}
.feedback.ok{background:var(--green-light);color:var(--green-dark);} .feedback.bad{background:var(--danger-light);color:#7A2A0F;}
.score-dots{display:flex;gap:5px;margin-top:12px;flex-wrap:wrap;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.hit{background:var(--green);} .dot.miss{background:var(--danger);}
.rule-note{background:var(--green-light);border:1px solid #CFE7D8;border-radius:10px;padding:14px;font-size:13px;color:var(--green-dark);line-height:1.5;margin-bottom:10px;}
.result-fail{text-align:center;padding:6px 0;} .result-fail .big{font-size:38px;margin-bottom:4px;}
.result-pass{text-align:center;}
.cert-frame{border:2px solid var(--gold);outline:6px solid var(--green-light);outline-offset:-10px;position:relative;background:linear-gradient(180deg,#FFFEF9,var(--card));}
.stamp{width:130px;height:130px;margin:4px auto 12px;border:5px solid var(--green);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--green-dark);font-family:'Poppins',sans-serif;font-weight:800;font-size:13px;text-align:center;line-height:1.25;transform:rotate(-12deg) scale(0.4);opacity:0;animation:stampin .5s cubic-bezier(.2,1.6,.4,1) .15s forwards;position:relative;}
.stamp::after{content:"";position:absolute;inset:8px;border:1.5px solid var(--green);border-radius:50%;}
@keyframes stampin{0%{transform:rotate(-12deg) scale(0.4);opacity:0;}60%{transform:rotate(-12deg) scale(1.08);opacity:1;}100%{transform:rotate(-12deg) scale(1);opacity:1;}}
.cert-fields{text-align:left;border-top:1px dashed var(--line);margin-top:6px;padding-top:14px;}
.cf-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line);}
.cf-row .k{color:var(--muted);} .cf-row .v{font-weight:600;text-align:right;}
.gate-note{background:var(--ink);color:#fff;font-family:'Poppins',sans-serif;font-weight:600;font-size:12.5px;text-align:center;padding:10px;border-radius:8px;margin-top:12px;letter-spacing:0.02em;}
.selfie-frame{width:100%;max-width:320px;aspect-ratio:3/4;margin:14px auto;border-radius:14px;overflow:hidden;background:#111;position:relative;}
.selfie-thumb{display:block;width:150px;height:150px;object-fit:cover;border-radius:14px;border:3px solid var(--gold);margin:14px auto 0;}
.selfie-frame video, .selfie-frame img{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);}
.warm-msg{text-align:center;margin-top:20px;padding-top:18px;border-top:1px dashed var(--line);}
.warm-msg-logo{width:120px;margin:0 auto 12px;display:block;}
.warm-msg-title{font-family:'Poppins',sans-serif;font-weight:700;font-size:16px;color:var(--green-dark);margin:0 0 8px;}
.warm-msg-text{font-size:13px;line-height:1.55;color:var(--ink);margin:0 0 10px;max-width:400px;margin-left:auto;margin-right:auto;}
.warm-msg-motto{font-family:'Poppins',sans-serif;font-weight:700;font-size:13.5px;color:var(--gold-dark);margin:0;}
.safety-notice{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);}
.safety-notice p{color:var(--danger);font-style:italic;font-size:11.5px;line-height:1.5;text-align:center;margin:0 0 8px;}
.safety-notice p:last-child{margin-bottom:0;}
.foot{display:flex;gap:10px;padding:0 22px 22px;}
button.btn{flex:1;padding:13px 16px;border-radius:8px;border:none;font-family:'Poppins',sans-serif;font-weight:700;font-size:14.5px;letter-spacing:0.01em;cursor:pointer;transition:filter .15s, transform .05s;}
button.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--green);color:#fff;} .btn-primary:hover{filter:brightness(1.08);}
.btn-primary:disabled{background:#C6D3C6;color:#8B978B;cursor:not-allowed;}
.btn-ghost{background:transparent;color:var(--muted);border:1.5px solid var(--line);} .btn-ghost:hover{border-color:var(--muted);}
.btn-alert{background:var(--danger);color:#fff;}
.footer-note{color:#7C877B;font-size:11px;text-align:center;max-width:440px;margin-top:14px;line-height:1.5;padding:0 20px;}

/* ===== EcoOils minimal Shell-style theme (look only) ===== */
:root{--green:#44a276;--green-dark:#231f20;--green-light:#eef7f2;--gold:#ffc600;--gold-dark:#ffc600;--ink:#231f20;--bg:#fff;--card:#fff;--line:#dcdcdc;--muted:#6e6b6c;--danger:#c0392b;--danger-light:#fff;--radius:8px;}
html,body,button,input,select,textarea{font-family:Jost,system-ui,Arial,sans-serif;}
body{background:#fff;font-size:16px;font-weight:400;position:relative;}
body::after{content:"";position:fixed;right:-26px;bottom:-26px;width:180px;height:180px;pointer-events:none;z-index:0;opacity:.3;background-image:radial-gradient(circle,#aaa 0 4.5px,transparent 5.5px);background-size:30px 30px;background-position:0 0;-webkit-mask-image:linear-gradient(#000,#000);}
.stage,.progress-wrap,.footer-note,.topbar{position:relative;z-index:1;}
.topbar{background:#fff;border-bottom:0;padding:14px 16px 0;}
.topbar-inner{max-width:480px;margin:0 auto;display:block;}
.topbar .brandrow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.logo-img{height:42px;}
.topbar .rightcol{display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
#verTag{font-size:12px;font-weight:500;color:#6e6b6c;letter-spacing:.06em;line-height:1;}
.langtoggle{position:static;border:0;border-radius:0;overflow:visible;display:flex;gap:14px;background:none;}
.langtoggle button{border:0;border-bottom:3px solid transparent;background:none;color:#6e6b6c;font-family:Jost,system-ui,Arial,sans-serif;font-size:15px;font-weight:500;padding:4px 0 3px;min-height:0;cursor:pointer;}
.langtoggle button.active{background:none;color:#231f20;border-bottom-color:#44a276;}
.topbar h1{font-family:Jost,system-ui,Arial,sans-serif;font-weight:300;font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:#6e6b6c;text-align:left;margin:0;padding:26px 0 14px;position:relative;border-bottom:1px solid #231f20;}
.topbar h1::after{content:"";position:absolute;left:0;bottom:-4px;width:44px;height:7px;background:#44a276;}
.topbar .sub{font-size:13px;color:#6e6b6c;text-align:left;margin-top:14px;}
@media (max-width:420px){.topbar h1{font-size:18px;letter-spacing:.1em;}.langtoggle button{font-size:14px;}}
.progress-track{height:4px;border-radius:0;background:#e6e6e6;}
.progress-fill{background:#44a276;}
.progress-text{font-family:Jost,system-ui,sans-serif;font-size:12px;color:#6e6b6c;}
.card{box-shadow:none;border:1px solid #dcdcdc;border-radius:8px;background:#fff;}
.eyebrow,.checkbadge,.contact-row .num,.rule-pill,.panel h2,.panel h3,.iogp-tag,.iogp-rule,.lesson-box b,.contact-group,.dl-btn,.field label,.gate-note,.warm-msg-title,.warm-msg-motto,.stamp,button.btn{font-family:Jost,system-ui,Arial,sans-serif;}
.field input,.field select,.opt{font-family:Jost,system-ui,Arial,sans-serif;font-size:16px;background:#fff;}
.panel h2{font-weight:500;color:#231f20;}
.panel h3{font-weight:500;color:#231f20;}
.eyebrow{color:#6e6b6c;font-weight:500;}
.panel p.desc,ul.rules li,.icon-item,.cf-row,.contact-row,.rule-note,.feedback{font-size:15px;}
.rule-pill.p1{background:#231f20;} .rule-pill.p2{background:#44a276;color:#231f20;} .rule-pill.p3{background:#6e6b6c;}
ul.rules li::before{color:#44a276;} ul.rules li.warn::before{color:#231f20;}

.lsr-item,.lsr-icon-tile span,.lsr-rewatch-link span:last-child{color:#231f20;}
.video-links a svg{stroke:#231f20;}
.confirm-gate{background:#fff;border:1px solid #dcdcdc;color:#231f20;}
.rule-note{background:#fff;border:1px solid #dcdcdc;color:#231f20;}
.iogp-box{background:#fff;border:1px solid #dcdcdc;border-left:5px solid #44a276;} .iogp-tag,.iogp-rule{color:#231f20;}
.lesson-box{background:#fffbe6;border:1px solid #f1e3a0;border-left:5px solid #ffc600;color:#231f20;} .lesson-box b{color:#231f20;}

.contact-row .num{color:#231f20;}

.checkbadge{background:#fff;border:1px solid #dcdcdc;color:#231f20;}

.opt:hover{border-color:#44a276;}
.opt.correct{background:#eef7f2;border-color:#44a276;color:#231f20;}
.opt.wrong{background:#fff;border-color:#231f20;color:#231f20;}
.feedback.ok{background:#eef7f2;color:#231f20;} .feedback.bad{background:#f4f4f4;color:#231f20;}

.stamp{border-color:#44a276;color:#231f20;font-weight:600;} .stamp::after{border-color:#44a276;}
.cf-row .k{color:#6e6b6c;}
.gate-note{background:#231f20;color:#fff;font-weight:500;}
.selfie-thumb{border-color:#44a276;}
.warm-msg-title{color:#231f20;font-weight:500;} .warm-msg-motto{color:#231f20;font-weight:500;}
button.btn{border-radius:8px;font-weight:600;font-size:16px;min-height:44px;letter-spacing:0;transition:background .15s;}
.btn-primary{background:#44a276;color:#231f20;font-weight:600;} .btn-primary:hover{filter:none;background:#3a9167;}

.btn-ghost{background:#fff;color:#231f20;border:1px solid #aaa;} .btn-ghost:hover{border-color:#231f20;}

.footer-note{padding-bottom:150px;}

/* ===== Fit-to-screen: the app wraps whatever screen it opens on ===== */
:root{--col:100%;--zoomK:1;}
.topbar-inner,.progress-wrap,.stage{max-width:var(--col);width:100%;}

function icon(kind){
  const s='stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"';
  if(kind==='ban') return `<svg viewBox="0 0 24 24" ${s}><circle cx="12" cy="12" r="9"/><path d="M6 6l12 12"/></svg>`;
  if(kind==='check') return `<svg viewBox="0 0 24 24" ${s}><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>`;
  if(kind==='alert') return `<svg viewBox="0 0 24 24" ${s}><path d="M12 3l10 18H2z"/><path d="M12 10v4"/><circle cx="12" cy="17" r="0.6" fill="currentColor"/></svg>`;
  if(kind==='bell') return `<svg viewBox="0 0 24 24" ${s}><path d="M12 3a5 5 0 00-5 5c0 5-2 6-2 6h14s-2-1-2-6a5 5 0 00-5-5z"/><path d="M10 19a2 2 0 004 0"/></svg>`;
  return '';
}

function lsrIcon(key){
  const b64 = LSR_ICON_B64[key];
  if(b64) return `<img src="data:image/png;base64,${b64}" alt="${key}" class="lsr-icon-img">`;
  const s='stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"';
  return `<svg viewBox="0 0 24 24" ${s}></svg>`;
}

/* ============ CONTENT SECTIONS (bilingual) ============ */
function ul(items,lang){ return '<ul class="rules">'+items.map(i=>{const c=i.warn?' class="warn"':''; return `<li${c}>${i[lang]}</li>`;}).join('')+'</ul>'; }
function iconGrid(items,lang){
  return '<div class="icon-grid">'+items.map(i=>{
    const cls = i.type==='neg'?'neg':(i.type==='info'?'info':'pos');
    const ic = i.type==='neg'?'ban':(i.type==='info'?'alert':'check');
    return `<div class="icon-item ${cls}">${icon(ic)}<span>${i[lang]}</span></div>`;
  }).join('')+'</div>';
}

{ // 0 Who We Are
  tag:{en:"Who We Are",id:"Tentang Kami",ms:"Siapa Kami"}, title:{en:"Who We Are",id:"Tentang Kami",ms:"Siapa Kami"},
  bodyFn:(lang)=>`<p class="desc">${lang==='en'?"Established more than 40 years ago, EcoOils is a regional leading waste oil manufacturer. EcoOils deploys cutting-edge recycling technology to divert waste from landfills, generating spent bleaching earth oil (SBEO) and other ISCC-certified biofuel feedstocks.":lang==='ms'?"Ditubuhkan lebih 40 tahun lalu, EcoOils ialah pengeluar minyak buangan terkemuka di rantau ini. EcoOils menggunakan teknologi kitar semula termaju untuk mengelakkan sisa daripada tapak pelupusan, menghasilkan minyak tanah liat peluntur terpakai (SBEO) dan bahan mentah biobahan api lain yang diperakui ISCC.":"Didirikan lebih dari 40 tahun lalu, EcoOils adalah produsen minyak limbah terkemuka di kawasan ini. EcoOils menerapkan teknologi daur ulang mutakhir untuk mengalihkan limbah dari TPA, menghasilkan spent bleaching earth oil (SBEO) dan bahan baku biofuel lain yang bersertifikasi ISCC."}</p>

{ // 4 Emergency Evacuation — NO CHECK (removed per request)
  tag:{en:"Emergency Evacuation",id:"Evakuasi Darurat",ms:"Pemindahan Kecemasan"}, title:{en:"Emergency Evacuation (Office Set-Up)",id:"Evakuasi Darurat (Tata Letak Kantor)",ms:"Pemindahan Kecemasan (Susunan Pejabat)"},
  bodyFn:(lang)=>`<ol style="margin:0;padding-left:20px;font-size:13.5px;line-height:1.6;color:var(--ink);">
    <li><b>${lang==='en'?'Identify exits:':lang==='ms'?'Kenal pasti pintu keluar:':'Identifikasi jalur keluar:'}</b> ${lang==='en'?'locate the nearest primary and secondary emergency exits — never use elevators':lang==='ms'?'cari pintu keluar kecemasan utama dan sekunder yang terdekat — jangan sekali-kali menggunakan lif':'temukan jalur keluar darurat utama dan cadangan terdekat — jangan pernah gunakan lift'}</li>
    <li><b>${lang==='en'?'Stay calm:':lang==='ms'?'Bertenang:':'Tetap tenang:'}</b> ${lang==='en'?'move quickly and orderly without running, to avoid trips, falls or crowd crush':lang==='ms'?'bergerak dengan pantas dan teratur tanpa berlari, untuk mengelakkan tersandung, jatuh atau berasak-asak':'bergerak cepat dan tertib tanpa berlari, untuk menghindari tersandung, jatuh, atau desak-desakan'}</li>
    <li><b>${lang==='en'?'Leave belongings:':lang==='ms'?'Tinggalkan barang:':'Tinggalkan barang bawaan:'}</b> ${lang==='en'?'abandon non-essential items immediately':lang==='ms'?'tinggalkan serta-merta barang yang tidak penting':'segera tinggalkan barang yang tidak penting'}</li>
    <li><b>${lang==='en'?'Assist others:':lang==='ms'?'Bantu orang lain:':'Bantu orang lain:'}</b> ${lang==='en'?"help those with mobility issues if it's safe to do so":lang==='ms'?'bantu mereka yang mempunyai masalah pergerakan jika selamat untuk berbuat demikian':'bantu mereka yang memiliki keterbatasan gerak jika aman untuk dilakukan'}</li>
    <li><b>${lang==='en'?'Report to assembly:':lang==='ms'?'Lapor diri di tempat berhimpun:':'Lapor ke titik kumpul:'}</b> ${lang==='en'?'head to the designated safe zone and check in for a head count':lang==='ms'?'pergi ke zon selamat yang ditetapkan dan daftar masuk untuk pengiraan kehadiran':'menuju zona aman yang ditentukan dan lapor untuk penghitungan jumlah orang'}</li>
  </ol>`,
  check:null
},

{ // 11 Working at Heights
  tag:{en:"Working at Heights",id:"Bekerja di Ketinggian",ms:"Kerja di Tempat Tinggi"}, title:{en:"Working at Heights",id:"Bekerja di Ketinggian",ms:"Kerja di Tempat Tinggi"},
  bodyFn:(lang)=>`<p class="desc">${lang==='en'?"Any work activity above 1.8 meters requires appropriate fall prevention or fall protection measures based on a risk assessment (e.g., harnesses, guardrails, lifelines). Ensure that all scaffolds and height access equipment have been inspected and are safe to use.":lang==='ms'?"Sebarang aktiviti kerja melebihi 1.8 meter memerlukan langkah pencegahan jatuh atau perlindungan jatuh yang sesuai berdasarkan penilaian risiko (contohnya, harness, pagar pelindung, tali penyelamat). Pastikan semua perancah dan peralatan akses ketinggian telah diperiksa dan selamat digunakan.":"Setiap aktivitas kerja di atas 1,8 meter memerlukan langkah pencegahan atau perlindungan jatuh yang sesuai berdasarkan penilaian risiko (misalnya harness, guardrail, lifeline). Pastikan seluruh perancah (scaffold) dan alat akses ketinggian telah diperiksa dan aman digunakan."}</p>`,
  check:{ q:{en:"Above what height does work require fall prevention or protection measures?",id:"Di atas ketinggian berapa pekerjaan memerlukan langkah pencegahan atau perlindungan jatuh?",ms:"Pada ketinggian berapakah kerja memerlukan langkah pencegahan atau perlindungan jatuh?"},
    opts:[{en:"1.0 metre",id:"1,0 meter",ms:"1.0 meter"},{en:"1.8 metres",id:"1,8 meter",ms:"1.8 meter"},{en:"3.0 metres",id:"3,0 meter",ms:"3.0 meter"},{en:"No height limit applies",id:"Tidak ada batas ketinggian yang berlaku",ms:"Tiada had ketinggian dikenakan"}], correct:1,
    ok:{en:"Correct — above 1.8 metres, based on a risk assessment.",id:"Benar — di atas 1,8 meter, berdasarkan penilaian risiko.",ms:"Betul — melebihi 1.8 meter, berdasarkan penilaian risiko."}, bad:{en:"Incorrect — the threshold is above 1.8 metres.",id:"Kurang tepat — batasnya adalah di atas 1,8 meter.",ms:"Salah — ambangnya ialah melebihi 1.8 meter."} }
},
{ // 12 Excavation Safety
  tag:{en:"Excavation Safety",id:"Keselamatan Galian",ms:"Keselamatan Korekan"}, title:{en:"Excavation Safety",id:"Keselamatan Galian (Excavation)",ms:"Keselamatan Korekan"},
  bodyFn:(lang)=>`<p class="desc">${lang==='en'?"Do not enter or cross any excavated areas without explicit authorization. These areas have potential risks such as collapses, falling materials, and falls. Entry is prohibited without proper authorization and safety measures.":lang==='ms'?"Jangan masuk atau merentasi sebarang kawasan korekan tanpa kebenaran yang jelas. Kawasan ini mempunyai risiko berpotensi seperti runtuhan, bahan jatuh, dan jatuh. Memasuki adalah dilarang tanpa kebenaran dan langkah keselamatan yang sewajarnya.":"Jangan memasuki atau melintasi area galian tanpa otorisasi yang jelas. Area ini memiliki potensi risiko seperti keruntuhan, material jatuh, dan terjatuh. Masuk dilarang tanpa otorisasi dan langkah keselamatan yang sesuai."}</p>`,
  check:{ q:{en:"Can you cross an excavated area without authorization?",id:"Bolehkah melintasi area galian tanpa otorisasi?",ms:"Bolehkah anda merentasi kawasan korekan tanpa kebenaran?"},
    opts:[{en:"Yes, if it looks stable",id:"Boleh, jika terlihat stabil",ms:"Ya, jika nampak stabil"},{en:"No — entry/crossing is prohibited without explicit authorization and safety measures",id:"Tidak — masuk/melintas dilarang tanpa otorisasi yang jelas dan langkah keselamatan",ms:"Tidak — memasuki/merentasi adalah dilarang tanpa kebenaran jelas dan langkah keselamatan"},{en:"Yes, if you walk quickly",id:"Boleh, asal berjalan cepat",ms:"Ya, jika anda berjalan dengan cepat"},{en:"Yes, during daylight only",id:"Boleh, hanya pada siang hari",ms:"Ya, pada waktu siang sahaja"}], correct:1,
    ok:{en:"Correct — never enter or cross an excavation without explicit authorization.",id:"Benar — jangan pernah memasuki atau melintasi area galian tanpa otorisasi yang jelas.",ms:"Betul — jangan sekali-kali memasuki atau merentasi korekan tanpa kebenaran yang jelas."}, bad:{en:"Incorrect — entry or crossing is prohibited without explicit authorization and safety measures.",id:"Kurang tepat — masuk atau melintas dilarang tanpa otorisasi yang jelas dan langkah keselamatan.",ms:"Salah — memasuki atau merentasi adalah dilarang tanpa kebenaran jelas dan langkah keselamatan."} }
},
{ // 13 Electrical Safety
  tag:{en:"Electrical Safety",id:"Keselamatan Listrik",ms:"Keselamatan Elektrik"}, title:{en:"Electrical Safety",id:"Keselamatan Listrik",ms:"Keselamatan Elektrik"},
  bodyFn:(lang)=>`<p class="desc">${lang==='en'?"Numerous electrical panels are present on site. Do not touch or attempt to operate any electrical equipment. Danger Electrical Hazard signs are clearly displayed on these panels. Only authorized personnel should handle electrical equipment.":lang==='ms'?"Banyak panel elektrik terdapat di tapak. Jangan sentuh atau cuba mengendalikan sebarang peralatan elektrik. Papan tanda Bahaya Elektrik dipaparkan dengan jelas pada panel ini. Hanya kakitangan yang diberi kuasa boleh mengendalikan peralatan elektrik.":"Terdapat banyak panel listrik di site. Jangan menyentuh atau mencoba mengoperasikan peralatan listrik apa pun. Rambu Danger Electrical Hazard ditampilkan dengan jelas pada panel-panel tersebut. Hanya personel berwenang yang boleh menangani peralatan listrik."}</p>`,
  check:{ q:{en:"Who should handle electrical equipment on site?",id:"Siapa yang boleh menangani peralatan listrik di site?",ms:"Siapakah yang boleh mengendalikan peralatan elektrik di tapak?"},
    opts:[{en:"Anyone who feels confident",id:"Siapa saja yang merasa mampu",ms:"Sesiapa yang berasa yakin"},{en:"Only authorized personnel",id:"Hanya personel yang berwenang",ms:"Hanya kakitangan yang diberi kuasa"},{en:"Any visitor, if supervised",id:"Pengunjung mana pun, jika diawasi",ms:"Mana-mana pelawat, jika diselia"},{en:"Anyone, as long as the power is off",id:"Siapa saja, asal listrik sudah dimatikan",ms:"Sesiapa sahaja, asalkan kuasa dimatikan"}], correct:1,
    ok:{en:"Correct — only authorized personnel; never touch or operate electrical equipment yourself.",id:"Benar — hanya personel berwenang; jangan pernah menyentuh atau mengoperasikan peralatan listrik sendiri.",ms:"Betul — hanya kakitangan yang diberi kuasa; jangan sekali-kali menyentuh atau mengendalikan peralatan elektrik sendiri."}, bad:{en:"Incorrect — only authorized personnel should handle electrical equipment.",id:"Kurang tepat — hanya personel berwenang yang boleh menangani peralatan listrik.",ms:"Salah — hanya kakitangan yang diberi kuasa boleh mengendalikan peralatan elektrik."} }
},

sections.push({
  tag:{en:"Life Saving Rules Video",id:"Video Life Saving Rules",ms:"Video Life Saving Rules"},
  title:{en:"Life Saving Rules — Induction Video",id:"Video Induksi — Life Saving Rules",ms:"Life Saving Rules — Video Induksi"},
  bodyFn:(lang)=>`<img src="data:image/png;base64,${LSR_DIAMOND_B64}" alt="9 Life Saving Rules" style="display:block;width:100%;max-width:360px;margin:0 auto 16px;">
    <p class="desc">${UI[lang].videoDesc}</p>
    <h3>${lang==='en'?'The 9 Life Saving Rules':lang==='ms'?'9 Life Saving Rules':'9 Life Saving Rules'}</h3>
    <div class="lsr-icon-grid">${lsrData.map(r=>`<div class="lsr-icon-tile">${lsrIcon(r.key)}<span>${r.name[lang]}</span></div>`).join('')}</div>`,
  check:null
});
lsrData.forEach((r,idx)=>{
  sections.push({
    tag:{en:`Life Saving Rule ${idx+1}/9`,id:`Life Saving Rule ${idx+1}/9`,ms:`Life Saving Rule ${idx+1}/9`},
    title:r.name,
    confirmGate:true, lsrKey:r.key,
    bodyFn:(lang)=>{
      let h = `<div class="lsr-page-icon">${lsrIcon(r.key)}</div>`;
      h += `<p class="desc">${r.intro[lang]}</p>`;
      h += iogpBlock(r.key, lang);
      h += `<h3>${lang==='en'?'You must':lang==='ms'?'Anda mesti':'Anda wajib'}</h3>` + ul(r.you.map(x=>({en:x.en,id:x.id,ms:x.ms})),lang);
      if(r.sup.length) h += `<h3>${lang==='en'?'If you are the supervisor / Permit Holder, you must':lang==='ms'?'Jika anda penyelia / Pemegang Permit, anda mesti':'Jika Anda supervisor / Pemegang Izin, Anda wajib'}</h3>` + ul(r.sup.map(x=>({en:x.en,id:x.id,ms:x.ms})),lang);
      h += `<div class="zt-box">${lang==='en'?"EcoOils Zero Tolerance: choosing to break a Life Saving Rule means choosing not to work for EcoOils.":lang==='ms'?"Toleransi Sifar EcoOils: memilih untuk melanggar Life Saving Rule bermaksud memilih untuk tidak bekerja dengan EcoOils.":"Toleransi Nol EcoOils: memilih melanggar Life Saving Rule berarti memilih untuk tidak bekerja di EcoOils."}</div>`;
      h += videoGateHtml(r, lang);
      return h;
    },
    check: (()=>{
      const correctPair = r.you[0];
      const distractorPool = lsrData.filter(x=>x.key!==r.key).map(x=>x.you[0]).filter(Boolean);
      const d1 = distractorPool[idx % distractorPool.length];
      const d2 = distractorPool[(idx+2) % distractorPool.length];
      const d3 = distractorPool[(idx+4) % distractorPool.length];
      const arr = [correctPair,d1,d2,d3].map(x=>({en:x.en,id:x.id,ms:x.ms}));
      // shuffle the options (Fisher–Yates) and track where the correct answer lands
      for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
      const correctIdx = arr.findIndex(o=>o.en===correctPair.en);
      return { q:{en:`Which action matches the "${r.name.en}" rule?`, id:`Tindakan mana yang sesuai dengan aturan "${r.name.id}"?`,ms:`Tindakan manakah yang sepadan dengan peraturan "${r.name.ms}"?`},
        opts: arr, correct: correctIdx,
        ok:{en:"Correct.",id:"Benar.",ms:"Betul."}, bad:{en:"Not quite — review the rule above.",id:"Kurang tepat — tinjau kembali aturan di atas.",ms:"Kurang tepat — semak semula peraturan di atas."} };
    })()
  });
});

{ // Disciplinary Actions
  tag:{en:"Disciplinary Actions",id:"Tindakan Disiplin",ms:"Tindakan Disiplin"}, title:{en:"Disciplinary Actions",id:"Tindakan Disiplin",ms:"Tindakan Disiplin"},
  bodyFn:(lang)=>`<p class="desc" style="font-style:italic;">${lang==='en'?'"If you see it, own it, and act on it. If you ignore it, you encourage it."':lang==='ms'?'"Jika anda nampak, anda bertanggungjawab, dan bertindaklah. Jika anda abaikan, anda menggalakkannya."':'"Jika Anda melihatnya, ambil tanggung jawab, dan bertindaklah. Jika Anda mengabaikannya, Anda mendorongnya."'}</p>
    <h3>${lang==='en'?'General safety warnings':lang==='ms'?'Amaran keselamatan am':'Peringatan keselamatan umum'}</h3>
    <ul class="rules"><li>${lang==='en'?'Three-Warning System: warnings are tracked with a hole-punch on the ID card and an online log — a third warning results in a site ban':lang==='ms'?'Sistem Tiga Amaran: amaran dijejaki dengan lubang tebuk pada kad pengenalan dan log dalam talian — amaran ketiga mengakibatkan larangan memasuki tapak':'Sistem Tiga Peringatan: peringatan dicatat dengan lubang pada kartu ID (hole-punch) dan log online — peringatan ketiga mengakibatkan larangan masuk site'}</li>
    <li class="warn">${lang==='en'?'Zero Tolerance: serious violations can mean an immediate site ban, bypassing the warning system':lang==='ms'?'Toleransi Sifar: pelanggaran serius boleh bermaksud larangan segera memasuki tapak, memintas sistem amaran':'Toleransi Nol: pelanggaran serius dapat berarti larangan masuk site langsung, tanpa melalui sistem peringatan'}</li></ul>
    <h3>${lang==='en'?'Life Saving Rule violations (progressive discipline)':lang==='ms'?'Pelanggaran Life Saving Rule (disiplin progresif)':'Pelanggaran Life Saving Rule (disiplin bertahap)'}</h3>
    <ol style="margin:0;padding-left:20px;font-size:13px;line-height:1.6;">
      <li>${lang==='en'?'First Warning — one punch hole on the ID card':lang==='ms'?'Amaran Pertama — satu lubang tebuk pada kad pengenalan':'Peringatan Pertama — satu lubang pada kartu ID'}</li>
      <li>${lang==='en'?'Second Warning — two punch holes on the ID card, plus a written self-declaration acknowledging the consequences of a Third Warning':lang==='ms'?'Amaran Kedua — dua lubang tebuk pada kad pengenalan, serta akuan kendiri bertulis yang mengakui akibat Amaran Ketiga':'Peringatan Kedua — dua lubang pada kartu ID, disertai surat pernyataan tertulis yang menyatakan pemahaman atas konsekuensi Peringatan Ketiga'}</li>
      <li>${lang==='en'?'Third Warning — results in a site ban':lang==='ms'?'Amaran Ketiga — mengakibatkan larangan memasuki tapak':'Peringatan Ketiga — mengakibatkan larangan masuk site'}</li>
    </ol>
    <p class="desc" style="margin-top:8px;">${lang==='en'?"This mirrors Indonesia's statutory progressive warning-letter procedure — Surat Peringatan I, II, III (SP1, SP2, SP3) — under the Manpower Law (UU No. 13/2003 on Manpower, as amended, Art. 161), which requires successive written warnings before termination for repeated violations.":lang==='ms'?"Ini mencerminkan prosedur surat amaran progresif berkanun di Indonesia — Surat Peringatan I, II, III (SP1, SP2, SP3) — di bawah Undang-Undang Ketenagakerjaan (UU No. 13/2003 mengenai Ketenagakerjaan, seperti yang dipinda, Perkara 161), yang menghendaki surat amaran bertulis berturut-turut sebelum penamatan bagi pelanggaran berulang.":"Hal ini sejalan dengan prosedur Surat Peringatan bertahap sesuai ketentuan Indonesia — Surat Peringatan I, II, III (SP1, SP2, SP3) — berdasarkan Undang-Undang Ketenagakerjaan (UU No. 13/2003 tentang Ketenagakerjaan beserta perubahannya, Pasal 161), yang mensyaratkan peringatan tertulis bertahap sebelum pemutusan hubungan kerja atas pelanggaran berulang."}</p>
    <p class="desc" style="margin-top:8px;">${lang==='en'?'EcoOils reserves the right to skip steps based on severity. Gross misconduct results in immediate suspension pending investigation, and immediate termination if proven.':lang==='ms'?'EcoOils berhak melangkau langkah-langkah berdasarkan tahap keterukan. Salah laku berat mengakibatkan penggantungan serta-merta sementara menunggu siasatan, dan penamatan serta-merta jika terbukti.':'EcoOils berhak melompati tahapan berdasarkan tingkat keparahan. Pelanggaran berat mengakibatkan skorsing langsung menunggu investigasi, dan pemutusan hubungan kerja langsung jika terbukti.'}</p>`,
  check:{ q:{en:"How many warnings lead to a standard site ban under the three-warning system?",id:"Berapa kali peringatan yang mengakibatkan larangan masuk site di bawah sistem tiga peringatan?",ms:"Berapa banyak amaran membawa kepada larangan memasuki tapak standard di bawah sistem tiga amaran?"},

addLesson("Permit to Work", {
  en:"A permit that isn't at the work front doesn't exist. Never start — or sign — a permit for work already underway. A permit covers only its stated area, never the next zone.",
  id:"Izin yang tidak ada di lokasi kerja dianggap tidak ada. Jangan pernah memulai — atau menandatangani — izin untuk pekerjaan yang sudah berjalan. Izin hanya berlaku untuk area yang tertera, bukan zona di sebelahnya.",ms:"Permit yang tiada di kawasan kerja dianggap tidak wujud. Jangan sekali-kali memulakan — atau menandatangani — permit untuk kerja yang sudah berjalan. Permit hanya meliputi kawasan yang dinyatakan, bukan zon bersebelahan."});
addLesson("Stop Work Policy", {
  en:"Stop Work means STOP. No “almost done”, no negotiating. Anyone can call it, and everyone must obey.",
  id:"Stop Work berarti BERHENTI. Tidak ada “sebentar lagi selesai”, tidak ada tawar-menawar. Siapa pun dapat menyerukannya, dan semua orang wajib mematuhinya.",ms:"Henti Kerja bermaksud BERHENTI. Tiada “hampir siap”, tiada tawar-menawar. Sesiapa sahaja boleh menyerukannya, dan semua orang mesti mematuhinya."});
addLesson("Life Saving Rule 3/9", {
  en:"Stop the vehicle fully before using a phone. Use a flagman when reversing or manoeuvring. Lower the dump bed before moving.",
  id:"Hentikan kendaraan sepenuhnya sebelum menggunakan telepon. Gunakan flagman saat mundur atau bermanuver. Turunkan bak dump truck sebelum bergerak.",ms:"Hentikan kenderaan sepenuhnya sebelum menggunakan telefon. Gunakan pemberi isyarat (flagman) apabila mengundur atau mengendalikan kenderaan. Turunkan bak lori tuang sebelum bergerak."}, true);
addLesson("Life Saving Rule 4/9", {
  en:"Never energize equipment without a permit and lockout. Report any shock or tingle from metal fittings immediately.",
  id:"Jangan pernah mengaktifkan (energize) peralatan tanpa izin kerja dan lockout. Segera laporkan setiap sengatan atau rasa kesemutan dari bagian logam.",ms:"Jangan sekali-kali mengaktifkan peralatan tanpa permit dan kunci (lockout). Laporkan sebarang renjatan atau rasa kesemutan daripada kelengkapan logam dengan serta-merta."}, true);
addLesson("Life Saving Rule 5/9", {
  en:"Clear combustibles, including rubbish and plastic, 10 m before hot work. The fire watcher stays for the whole job.",
  id:"Singkirkan material mudah terbakar, termasuk sampah dan plastik, sejauh 10 m sebelum pekerjaan panas. Fire watcher tetap di tempat selama seluruh pekerjaan.",ms:"Bersihkan bahan mudah terbakar, termasuk sampah dan plastik, sejauh 10 m sebelum kerja panas. Pemerhati api (fire watcher) kekal sepanjang kerja."}, true);
addLesson("Life Saving Rule 7/9", {
  en:"Never stand under, or climb onto, a suspended load. No lift supervisor or full rigging crew means no lift. Use only certified rigging — no improvising.",
  id:"Jangan pernah berdiri di bawah, atau naik ke atas, beban yang tergantung. Tanpa supervisor pengangkatan atau kru rigging lengkap, tidak ada pengangkatan. Gunakan hanya rigging bersertifikat — jangan berimprovisasi.",ms:"Jangan sekali-kali berdiri di bawah, atau memanjat, beban yang tergantung. Tiada penyelia pengangkatan atau krew rigging lengkap bermakna tiada pengangkatan. Gunakan hanya rigging bersijil — jangan berimprovisasi."}, true);
addLesson("Life Saving Rule 9/9", {
  en:"A harness protects only when hooked to an approved anchor — re-check it when the plan changes. Secure tools with rated lanyards, never cable ties. Take up only what you'll use now, and barricade below.",
  id:"Harness hanya melindungi jika terkait pada titik jangkar yang ditetapkan — periksa ulang saat rencana berubah. Amankan alat dengan tool lanyard bersertifikat, bukan cable tie. Bawa naik hanya yang akan langsung digunakan, dan pasang barikade di bawahnya.",ms:"Harness hanya melindungi apabila disangkut pada sauh yang diluluskan — periksa semula apabila pelan berubah. Ikat alatan dengan tali alatan (lanyard) yang bertaraf, bukan tali kabel (cable tie). Bawa naik hanya apa yang akan anda gunakan sekarang, dan pasang penghadang di bawah."}, true);
addLesson("Mobile Equipment & Traffic", {
  en:"Check overhead clearance (cables, beams) before moving tall loads or trucks.",
  id:"Periksa ketinggian bebas di atas (kabel, balok) sebelum menggerakkan muatan tinggi atau truk.",ms:"Periksa ketinggian bebas di atas (kabel, alang) sebelum menggerakkan muatan atau lori yang tinggi."});
addLesson("Access Control & Site Zones", {
  en:"Vendors go straight from the gate to induction — never straight to the work area.",
  id:"Vendor langsung dari gerbang menuju induksi — jangan pernah langsung ke area kerja.",ms:"Vendor terus dari pintu pagar ke induksi — jangan sekali-kali terus ke kawasan kerja."});

ould waste be disposed of on site?":"Di manakah sisa harus dibuang di tapak?","Anywhere convenient":"Di mana-mana yang mudah","In the designated waste bins":"Dalam tong sisa yang ditetapkan","Left for someone else to clear":"Ditinggalkan untuk dibersihkan orang lain","Taken home":"Dibawa pulang","Correct — always use the designated waste bins.":"Betul — sentiasa gunakan tong sisa yang ditetapkan.","Incorrect — waste must go in the designated waste bins.":"Salah — sisa mesti dibuang dalam tong sisa yang ditetapkan.","Tool Safety":"Keselamatan Alatan","Tool Safety (If Applicable)":"Keselamatan Alatan (Jika Berkenaan)","If your work involves using tools, ensure you have received proper training on their safe use and inspection":"Jika kerja anda melibatkan penggunaan alatan, pastikan anda telah menerima latihan yang sewajarnya tentang penggunaan dan pemeriksaannya yang selamat","Always use the correct tool for the task":"Sentiasa gunakan alat yang betul untuk tugas tersebut","Before using a tool on site, what must you have?":"Sebelum menggunakan alat di tapak, apakah yang mesti anda ada?","Proper training on its safe use and inspection":"Latihan yang sewajarnya tentang penggunaan dan pemeriksaannya yang selamat","Just a general idea of how it works":"Hanya gambaran umum tentang cara ia berfungsi","Permission from any nearby colleague":"Kebenaran daripada mana-mana rakan sekerja yang berdekatan","Nothing — any tool can be used for any task":"Tiada — mana-mana alat boleh digunakan untuk apa-apa tugas","Correct — proper training, and always the right tool for the task.":"Betul — latihan yang sewajarnya, dan sentiasa gunakan alat yang betul untuk tugas tersebut.","Incorrect — you must be properly trained, and always use the correct tool for the task.":"Salah — anda mesti dilatih dengan sewajarnya, dan sentiasa menggunakan alat yang betul untuk tugas tersebut.","Manual Handling":"Pengendalian Secara Manual","Always use safe lifting techniques when manually handling materials":"Sentiasa gunakan teknik mengangkat yang selamat apabila mengendalikan bahan secara manual","Avoid lifting more than 23 kilograms":"Elakkan mengangkat lebih daripada 23 kilogram","If assistance or mechanical aids are available, use them as the primary option":"Jika bantuan atau alat bantuan mekanikal tersedia, gunakannya sebagai pilihan utama","What is the maximum weight you should avoid exceeding when lifting manually?":"Apakah berat maksimum yang perlu dielakkan apabila mengangkat secara manual?","10 kg":"10 kg","23 kg":"23 kg","40 kg":"40 kg","No limit":"Tiada had","Correct — avoid lifting more than 23 kg; use assistance or mechanical aids where available.":"Betul — elakkan mengangkat lebih daripada 23 kg; gunakan bantuan atau alat bantuan mekanikal jika tersedia.","Incorrect — avoid lifting more than 23 kg, and use assistance or mechanical aids where available.":"Salah — elakkan mengangkat lebih daripada 23 kg, dan gunakan bantuan atau alat bantuan mekanikal jika tersedia.","Hazard Communication":"Komunikasi Bahaya","Pay close attention to all safety signs and follow their instructions while on site":"Beri perhatian sepenuhnya kepada semua papan tanda keselamatan dan ikut arahannya semasa di tapak","If any chemicals or hazardous materials need to be brought onto the site, ensure prior communication":"Jika sebarang bahan kimia atau bahan berbahaya perlu dibawa masuk ke tapak, pastikan makluman terlebih dahulu","Provide the Safety Data Sheet (SDS) and delivery note":"Sediakan Lembaran Data Keselamatan (SDS) dan nota penghantaran","Before bringing any chemicals or hazardous materials onto site, what must you provide?":"Sebelum membawa sebarang bahan kimia atau bahan berbahaya ke tapak, apakah yang mesti anda sediakan?","Nothing, just bring it in":"Tiada, bawa masuk sahaja","The Safety Data Sheet (SDS) and delivery note, with prior communication":"Lembaran Data Keselamatan (SDS) dan nota penghantaran, dengan makluman terlebih dahulu","A verbal mention to any worker nearby":"Sebutan secara lisan kepada mana-mana pekerja yang berdekatan","A photo of the container":"Gambar bekas tersebut","Correct — prior communication plus the SDS and delivery note.":"Betul — makluman terlebih dahulu serta SDS dan nota penghantaran.","Incorrect — you must communicate in advance and provide the SDS and delivery note.":"Salah — anda mesti memaklumkan terlebih dahulu dan menyediakan SDS serta nota penghantaran.","Working at Heights":"Kerja di Tempat Tinggi","Above what height does work require fall prevention or protection measures?":"Pada ketinggian berapakah kerja memerlukan langkah pencegahan atau perlindungan jatuh?","1.0 metre":"1.0 meter","1.8 metres":"1.8 meter","3.0 metres":"3.0 meter","No height limit applies":"Tiada had ketinggian dikenakan","Correct — above 1.8 metres, based on a risk assessment.":"Betul — melebihi 1.8 meter, berdasarkan penilaian risiko.","Incorrect — the threshold is above 1.8 metres.":"Salah — ambangnya ialah melebihi 1.8 meter.","Excavation Safety":"Keselamatan Korekan","Can you cross an excavated area without authorization?":"Bolehkah anda merentasi kawasan korekan tanpa kebenaran?","Yes, if it looks stable":"Ya, jika nampak stabil","No — entry/crossing is prohibited without explicit authorization and safety measures":"Tidak — memasuki/merentasi adalah dilarang tanpa kebenaran jelas dan langkah keselamatan","Yes, if you walk quickly":"Ya, jika anda berjalan dengan cepat","Yes, during daylight only":"Ya, pada waktu siang sahaja","Correct — never enter or cross an excavation without explicit authorization.":"Betul — jangan sekali-kali memasuki atau merentasi korekan tanpa kebenaran yang jelas.","Incorrect — entry or crossing is prohibited without explicit authorization and safety measures.":"Salah — memasuki atau merentasi adalah dilarang tanpa kebenaran jelas dan langkah keselamatan.","Electrical Safety":"Keselamatan Elektrik","Who should handle electrical equipment on site?":"Siapakah yang boleh mengendalikan peralatan elektrik di tapak?","Anyone who feels confident":"Sesiapa yang berasa yakin","Only authorized personnel":"Hanya kakitangan yang diberi kuasa","Any visitor, if supervised":"Mana-mana pelawat, jika diselia","Anyone, as long as the power is off":"Sesiapa sahaja, asalkan kuasa dimatikan","Correct — only authorized personnel; never touch or operate electrical equipment yourself.":"Betul — hanya kakitangan yang diberi kuasa; jangan sekali-kali menyentuh atau mengendalikan peralatan elektrik sendiri.","Incorrect — only authorized personnel should handle electrical equipment.":"Salah — hanya kakitangan yang diberi kuasa boleh mengendalikan peralatan elektrik.","Mobile Equipment & Traffic":"Peralatan Mudah Alih & Trafik","Mobile Equipment Safety & Site Traffic Management":"Keselamatan Peralatan Mudah Alih & Pengurusan Trafik Tapak","Be aware of the frequent movement of heavy equipment like excavators, cranes, and piling equipment & vehicles":"Sedar akan pergerakan kerap peralatan berat seperti jengkaut, kren dan peralatan cerucuk & kenderaan","Stay clear of all moving equipment":"Jauhi semua peralatan yang bergerak","If your presence is not required in a work zone, please stay away":"Jika kehadiran anda tidak diperlukan di zon kerja, sila jauhi zon tersebut","Never position yourself close to or under suspended loads":"Jangan sekali-kali berada berhampiran atau di bawah beban yang tergantung","If using an authorized vehicle, the speed limit is 15 km/hr":"Jika menggunakan kenderaan yang dibenarkan, had lajunya ialah 15 km/j","Where should you never position yourself around lifting operations?":"Di manakah anda tidak boleh berada di sekitar operasi pengangkatan?","Close to or under suspended loads":"Berhampiran atau di bawah beban yang tergantung","Behind a barrier":"Di belakang penghadang","In the designated viewing area":"Di kawasan tontonan yang ditetapkan","At the muster point":"Di tempat berkumpul (muster point)","Correct — never stand close to or under a suspended load, and stay clear of moving equipment.":"Betul — jangan sekali-kali berdiri berhampiran atau di bawah beban yang tergantung, dan jauhi peralatan yang bergerak.","Incorrect — you must never position yourself close to or under a suspended load.":"Salah — anda tidak boleh sekali-kali berada berhampiran atau di bawah beban yang tergantung.","Access Control & Site Zones":"Kawalan Akses & Zon Tapak","Access Control and Site Zones":"Kawalan Akses dan Zon Tapak","Always use the provided pedestrian walkways":"Sentiasa gunakan laluan pejalan kaki yang disediakan","Hard-barrier areas are restricted, and all work activities within these areas are controlled by a Permit to Work (PTW) system":"Kawasan penghadang tegar adalah terhad, dan semua aktiviti kerja dalam kawasan ini dikawal oleh sistem Permit Kerja (PTW)","Remember: No PTW, No Work":"Ingat: Tiada PTW, Tiada Kerja","All activities must have a valid PTW and an approved Job Hazard Analysis (JHA)":"Semua aktiviti mesti mempunyai PTW yang sah dan Analisis Bahaya Kerja (JHA) yang diluluskan","What is required for any work activity inside a hard-barrier area?":"Apakah yang diperlukan untuk sebarang aktiviti kerja di dalam kawasan penghadang tegar?","Nothing, just walk in":"Tiada, masuk sahaja","A valid Permit to Work (PTW) and an approved JHA":"Permit Kerja (PTW) yang sah dan JHA yang diluluskan","A verbal go-ahead from any worker":"Kebenaran lisan daripada mana-mana pekerja","Just a hard hat":"Hanya topi keledar","Correct — No PTW, No Work. A valid PTW and approved JHA are always required.":"Betul — Tiada PTW, Tiada Kerja. PTW yang sah dan JHA yang diluluskan sentiasa diperlukan.","Incorrect — a valid PTW and approved JHA are always required, and pedestrian walkways must be used.":"Salah — PTW yang sah dan JHA yang diluluskan sentiasa diperlukan, dan laluan pejalan kaki mesti digunakan.","Bypassing Safety Controls":"Memintas Kawalan Keselamatan","Safety-critical equipment (fire/explosion protection, guards, interlocks, alarms) and procedures exist to prevent or limit a fatality or major accident.":"Peralatan kritikal keselamatan (perlindungan kebakaran/letupan, pengawal, interlock, penggera) dan prosedur wujud untuk mencegah atau mengehadkan kematian atau kemalangan besar.","Obtain authorization from the supervisor or issuing authority before overriding or disabling a critical device, system or alarm.":"Dapatkan kebenaran daripada penyelia atau pihak berkuasa yang mengeluarkan sebelum memintas atau melumpuhkan peranti, sistem atau penggera kritikal.","Identify the critical device/system/alarm for the work activity.":"Kenal pasti peranti/sistem/penggera kritikal bagi aktiviti kerja.","Confirm authorization is obtained from the right level.":"Sahkan kebenaran diperoleh daripada peringkat yang betul.","Confined Space":"Ruang Terkurung","A confined space (vessel, tank, pipe, cellar, excavation) can contain explosive gas, a toxic or asphyxiating atmosphere, or other dangers. Authorized access keeps you safe.":"Ruang terkurung (bekas, tangki, paip, bilik bawah tanah, korekan) boleh mengandungi gas mudah meletup, atmosfera toksik atau menyesakkan, atau bahaya lain. Akses yang dibenarkan memastikan anda selamat.","Before entering a confined space, you must obtain authorization (PTW), test and monitor the atmosphere, and verify the space is safe for entry before proceeding.":"Sebelum memasuki ruang terkurung, anda mesti mendapatkan kebenaran (PTW), menguji dan memantau atmosfera, serta mengesahkan ruang itu selamat untuk dimasuki sebelum meneruskan.","Confirm with the Safety Watch that you can enter.":"Sahkan dengan Safety Watch (pemerhati keselamatan) bahawa anda boleh masuk.","Follow the requirements of the work permit.":"Ikut keperluan permit kerja.","Confirm permit requirements are in place.":"Sahkan keperluan permit telah dipenuhi.","Confirm a qualified safety watch is always present.":"Sahkan Safety Watch yang berkelayakan sentiasa hadir.","Confirm gas testing is carried out per the permit.":"Sahkan ujian gas dijalankan mengikut permit.","Confirm it is safe to start.":"Sahkan ia selamat untuk bermula.","Driving":"Pemanduan","Drivers and passengers share responsibility for each other's safety, including wearing seatbelts. Fitness for duty means not being under the influence of drugs or alcohol.":"Pemandu dan penumpang berkongsi tanggungjawab terhadap keselamatan satu sama lain, termasuk memakai tali pinggang keledar. Kecergasan untuk bertugas bermaksud tidak berada di bawah pengaruh dadah atau alkohol.","Always use a 3-point seatbelt and keep it fastened while the vehicle is moving.":"Sentiasa gunakan tali pinggang keledar 3 titik dan pastikan ia dipasang semasa kenderaan bergerak.","Confirm everyone is wearing a seatbelt before driving.":"Pastikan semua orang memakai tali pinggang keledar sebelum memandu.","(Driver) Never use a phone, radio or text message while driving.":"(Pemandu) Jangan sekali-kali menggunakan telefon, radio atau mesej teks semasa memandu.","(Passenger) Intervene if the driver uses a phone while driving.":"(Penumpang) Tegur jika pemandu menggunakan telefon semasa memandu.","Energy Isolation":"Pengasingan Tenaga","Energy isolation separates people from hazards such as electricity, pressure and energized equipment. Stored energy must be dissipated before work starts.":"Pengasingan tenaga memisahkan orang daripada bahaya seperti elektrik, tekanan dan peralatan bertenaga. Tenaga tersimpan mesti dilepaskan sebelum kerja bermula.","Understand the isolations that protect you.":"Fahami pengasingan yang melindungi anda.","Confirm with the supervisor/Permit Holder that isolations are in place.":"Sahkan dengan penyelia/Pemegang Permit bahawa pengasingan telah dipasang.","Confirm it's safe to start.":"Sahkan ia selamat untuk bermula.","Confirm isolations are in place (locked valves/breakers, spades, locked doors).":"Sahkan pengasingan telah dipasang (injap/pemutus litar berkunci, spade, pintu berkunci).","Confirm no stored energy or other hazards remain.":"Sahkan tiada tenaga tersimpan atau bahaya lain yang tinggal.","Hot Work":"Kerja Panas","Hot work is any activity that creates an ignition source in an area that may contain hydrocarbons or flammable materials.":"Kerja panas ialah sebarang aktiviti yang mewujudkan punca penyalaan dalam kawasan yang mungkin mengandungi hidrokarbon atau bahan mudah terbakar.","Identify ignition sources (welding, grinding, torching, engines).":"Kenal pasti punca penyalaan (kimpalan, pengisaran, pemotongan api, enjin).","Recognize hazardous areas requiring special precautions.":"Kenali kawasan berbahaya yang memerlukan langkah berjaga-jaga khas.","Follow procedures correctly — failure could cause a fatality.":"Ikut prosedur dengan betul — kegagalan boleh menyebabkan kematian.","Confirm fire/explosion protection equipment is functional.":"Sahkan peralatan perlindungan kebakaran/letupan berfungsi.","Verify safety controls are in place and effective.":"Sahkan kawalan keselamatan telah dipasang dan berkesan.","Confirm the task can be performed exactly as planned.":"Sahkan tugas boleh dilaksanakan tepat seperti yang dirancang.","Authorize starting, resuming or handing over the work.":"Beri kebenaran untuk memulakan, menyambung semula atau menyerahkan kerja.","Line of Fire":"Line of Fire","This rule raises awareness of struck-by and caught-in-between hazards, which aren't always obvious and can appear as a task progresses.":"Peraturan ini meningkatkan kesedaran tentang bahaya terlanggar dan terhimpit, yang tidak selalu jelas dan boleh muncul semasa tugas berjalan.","Continually monitor your surroundings and position yourself out of the line of fire.":"Sentiasa pantau persekitaran anda dan letakkan diri anda di luar line of fire.","Ensure you're visible to drivers and equipment operators.":"Pastikan anda kelihatan kepada pemandu dan pengendali peralatan.","Recognize when you create a line of fire hazard for yourself or others.":"Kenali apabila anda mewujudkan bahaya line of fire untuk diri sendiri atau orang lain.","Confirm struck-by/caught-in-between hazards are identified and mitigated.":"Sahkan bahaya terlanggar/terhimpit telah dikenal pasti dan dikurangkan.","Ensure the team's positioning avoids all identified lines of fire.":"Pastikan kedudukan pasukan mengelak semua line of fire yang dikenal pasti.","Safe Mechanical Lifting":"Pengangkatan Mekanikal Selamat","Lifting operations must be planned and performed by competent personnel using certified equipment, with access controlled by barriers and exclusion zones.":"Operasi pengangkatan mesti dirancang dan dilaksanakan oleh kakitangan yang cekap menggunakan peralatan bersijil, dengan akses dikawal oleh penghadang dan zon pengecualian.","Confirm the lift is performed by competent personnel with certified equipment.":"Sahkan pengangkatan dilaksanakan oleh kakitangan yang cekap dengan peralatan bersijil.","Control access using barriers and exclusion zones.":"Kawal akses menggunakan penghadang dan zon pengecualian.","Verify equipment is certified for lifting people, if applicable.":"Sahkan peralatan bersijil untuk mengangkat orang, jika berkenaan.","Verify authorization to start/resume/hand over the lift.":"Sahkan kebenaran untuk memulakan/menyambung semula/menyerahkan pengangkatan.","Confirm safety controls are in place.":"Sahkan kawalan keselamatan telah dipasang.","Enforce fitness for duty.":"Kuatkuasakan kecergasan untuk bertugas.","Validate equipment certification.":"Sahkan pensijilan peralatan.","Work Authorisation":"Kebenaran Kerja","Work authorization means seeking and having authorization to start, resume, or hand over a task — not just a signature on a form.":"Kebenaran kerja bermaksud mendapatkan dan memiliki kebenaran untuk memulakan, menyambung semula, atau menyerahkan sesuatu tugas — bukan sekadar tandatangan pada borang.","Understand and follow the work permit.":"Fahami dan ikut permit kerja.","Confirm the permit is valid.":"Sahkan permit itu sah.","Confirm with the supervisor/Permit Holder that it's safe to start.":"Sahkan dengan penyelia/Pemegang Permit bahawa ia selamat untuk bermula.","Confirm if a permit is required.":"Sahkan sama ada permit diperlukan.","Confirm the workplace was inspected before work starts.":"Sahkan tempat kerja telah diperiksa sebelum kerja bermula.","Confirm the permit is signed and it's safe to start.":"Sahkan permit telah ditandatangani dan ia selamat untuk bermula.","Get a new permit if the work or situation changes.":"Dapatkan permit baharu jika kerja atau keadaan berubah.","Confirm the work is completed.":"Sahkan kerja telah selesai.","Working at Height":"Kerja di Tempat Tinggi","Work at height outside a protected area requires approved fall protection secured to an approved anchor point. Floor openings need physical barriers.":"Kerja di tempat tinggi di luar kawasan terlindung memerlukan perlindungan jatuh yang diluluskan, yang dipasang pada titik sauh yang diluluskan. Bukaan lantai memerlukan penghadang fizikal.","Have authorization to work at height outside a protected area.":"Miliki kebenaran untuk bekerja di tempat tinggi di luar kawasan terlindung.","Know what fall protection equipment to use and how to use it.":"Ketahui peralatan perlindungan jatuh yang perlu digunakan dan cara menggunakannya.","Check equipment before use.":"Periksa peralatan sebelum digunakan.","Always tie off when at height outside a protected area.":"Sentiasa ikat diri (tie off) apabila berada di tempat tinggi di luar kawasan terlindung.","Confirm it's safe to start work at height.":"Sahkan ia selamat untuk memulakan kerja di tempat tinggi.","Life Saving Rules Video":"Video Life Saving Rules","Life Saving Rules — Induction Video":"Life Saving Rules — Video Induksi","Life Saving Rule ${idx+1}/9":"Life Saving Rule ${idx+1}/9","Which action matches the \"${r.name.en}\" rule?":"Tindakan manakah yang sepadan dengan peraturan \"${r.name.ms}\"?","Not quite — review the rule above.":"Kurang tepat — semak semula peraturan di atas.","Permit to Work":"Permit Kerja","Permit to Work (Work Authorisation)":"Permit Kerja (Kebenaran Kerja)","A Permit to Work is required for hazardous tasks on...":"Permit Kerja diperlukan untuk tugas berbahaya di...","Any site, anywhere":"Mana-mana tapak, di mana sahaja","EcoOils premises & sites under EcoOils' direct control":"Premis EcoOils & tapak di bawah kawalan langsung EcoOils","Only night shift work":"Kerja syif malam sahaja","Vendor-owned vehicles only":"Kenderaan milik vendor sahaja","Incorrect — the PTW system applies to EcoOils premises and sites under EcoOils' direct control.":"Salah — sistem PTW terpakai untuk premis EcoOils dan tapak di bawah kawalan langsung EcoOils.","Stop Work Policy":"Dasar Henti Kerja","True or False: only supervisors are allowed to stop unsafe work.":"Betul atau Salah: hanya penyelia dibenarkan menghentikan kerja yang tidak selamat.","True":"Betul","False":"Salah","Correct — anyone has the Stop Work Obligation, not just supervisors.":"Betul — sesiapa sahaja mempunyai Kewajipan Henti Kerja, bukan penyelia sahaja.","Incorrect — anyone can and should stop unsafe work, not just supervisors.":"Salah — sesiapa sahaja boleh dan harus menghentikan kerja yang tidak selamat, bukan penyelia sahaja.","PPE & Critical Activities":"PPE & Aktiviti Kritikal","Mandatory PPE & Critical Activities":"PPE Wajib & Aktiviti Kritikal","Which of these is NOT part of the mandatory PPE list?":"Yang manakah BUKAN sebahagian daripada senarai PPE wajib?","Helmet with chin strap":"Topi keledar dengan tali dagu","Hi-vis vest":"Vest keterlihatan tinggi","Sandals":"Selipar","Safety glasses":"Cermin mata keselamatan","Correct — safety shoes/boots are mandatory, not sandals.":"Betul — kasut/but keselamatan adalah wajib, bukan selipar.","Incorrect — safety shoes/boots are mandatory; sandals are not on the PPE list.":"Salah — kasut/but keselamatan adalah wajib; selipar tiada dalam senarai PPE.","Disciplinary Actions":"Tindakan Disiplin","How many warnings lead to a standard site ban under the three-warning system?":"Berapa banyak amaran membawa kepada larangan memasuki tapak standard di bawah sistem tiga amaran?","Correct — a third warning results in a site ban.":"Betul — amaran ketiga mengakibatkan larangan memasuki tapak.","Incorrect — a third warning results in a site ban.":"Salah — amaran ketiga mengakibatkan larangan memasuki tapak.","A permit that isn't at the work front doesn't exist. Never start — or sign — a permit for work already underway. A permit covers only its stated area, never the next zone.":"Permit yang tiada di kawasan kerja dianggap tidak wujud. Jangan sekali-kali memulakan — atau menandatangani — permit untuk kerja yang sudah berjalan. Permit hanya meliputi kawasan yang dinyatakan, bukan zon bersebelahan.","Stop Work means STOP. No “almost done”, no negotiating. Anyone can call it, and everyone must obey.":"Henti Kerja bermaksud BERHENTI. Tiada “hampir siap”, tiada tawar-menawar. Sesiapa sahaja boleh menyerukannya, dan semua orang mesti mematuhinya.","Stop the vehicle fully before using a phone. Use a flagman when reversing or manoeuvring. Lower the dump bed before moving.":"Hentikan kenderaan sepenuhnya sebelum menggunakan telefon. Gunakan pemberi isyarat (flagman) apabila mengundur atau mengendalikan kenderaan. Turunkan bak lori tuang sebelum bergerak.","Never energize equipment without a permit and lockout. Report any shock or tingle from metal fittings immediately.":"Jangan sekali-kali mengaktifkan peralatan tanpa permit dan kunci (lockout). Laporkan sebarang renjatan atau rasa kesemutan daripada kelengkapan logam dengan serta-merta.","Clear combustibles, including rubbish and plastic, 10 m before hot work. The fire watcher stays for the whole job.":"Bersihkan bahan mudah terbakar, termasuk sampah dan plastik, sejauh 10 m sebelum kerja panas. Pemerhati api (fire watcher) kekal sepanjang kerja.","Never stand under, or climb onto, a suspended load. No lift supervisor or full rigging crew means no lift. Use only certified rigging — no improvising.":"Jangan sekali-kali berdiri di bawah, atau memanjat, beban yang tergantung. Tiada penyelia pengangkatan atau krew rigging lengkap bermakna tiada pengangkatan. Gunakan hanya rigging bersijil — jangan berimprovisasi.","A harness protects only when hooked to an approved anchor — re-check it when the plan changes. Secure tools with rated lanyards, never cable ties. Take up only what you'll use now, and barricade below.":"Harness hanya melindungi apabila disangkut pada sauh yang diluluskan — periksa semula apabila pelan berubah. Ikat alatan dengan tali alatan (lanyard) yang bertaraf, bukan tali kabel (cable tie). Bawa naik hanya apa yang akan anda gunakan sekarang, dan pasang penghadang di bawah.","Check overhead clearance (cables, beams) before moving tall loads or trucks.":"Periksa ketinggian bebas di atas (kabel, alang) sebelum menggerakkan muatan atau lori yang tinggi.","Vendors go straight from the gate to induction — never straight to the work area.":"Vendor terus dari pintu pagar ke induksi — jangan sekali-kali terus ke kawasan kerja.","Lessons from Our Site":"Pengajaran dari Tapak Kami","<b>Heat:</b> take shade and water breaks. Never pour cold water over your head after heat exposure. Report dizziness.":"<b>Haba:</b> berteduh dan berehat minum air. Jangan sekali-kali menyiram air sejuk ke atas kepala selepas terdedah kepada haba. Laporkan jika pening.","<b>Covers:</b> open holes and manholes need secured, load-rated covers — never plywood.":"<b>Penutup:</b> lubang dan lubang pembetung terbuka memerlukan penutup yang dipasang kukuh dan bertaraf beban — jangan sekali-kali papan lapis.","<b>Weather:</b> secure temporary structures and unfinished work before strong wind or storms.":"<b>Cuaca:</b> ikat dan selamatkan struktur sementara dan kerja yang belum siap sebelum angin kencang atau ribut.","<b>Damage:</b> report damage immediately — hiding it blocks the fix.":"<b>Kerosakan:</b> laporkan kerosakan dengan serta-merta — menyembunyikannya menghalang pembaikan.","Which of these is NOT one of EcoOils' Rules of Engagement?":"Yang manakah BUKAN salah satu Peraturan Penglibatan EcoOils?","Comply":"Patuh","Intervene":"Campur tangan","Respect":"Hormati","Improvise":"Berimprovisasi","Are visitors allowed to post their own site photos on social media?":"Adakah pelawat dibenarkan memuat naik gambar tapak sendiri ke media sosial?","No, never":"Tidak, tidak sekali-kali","Only on weekends":"Hujung minggu sahaja","Only with a filter":"Hanya dengan penapis","True or False: only supervisors have the Stop Work Obligation.":"Betul atau Salah: hanya penyelia mempunyai Kewajipan Henti Kerja.","A Permit to Work applies to work on...":"Permit Kerja terpakai untuk kerja di...","Only at night":"Waktu malam sahaja","Vendor vehicles only":"Kenderaan vendor sahaja","How many warnings lead to a standard site ban?":"Berapa banyak amaran membawa kepada larangan memasuki tapak standard?","In any emergency, what should you do first?":"Dalam sebarang kecemasan, apakah yang perlu anda lakukan dahulu?","Keep working until told to stop":"Terus bekerja sehingga diberitahu berhenti","Make the place safe and leave promptly and safely":"Pastikan tempat itu selamat dan keluar dengan segera dan selamat","Take photos for the report":"Ambil gambar untuk laporan","Wait for a text message":"Tunggu mesej teks","Which is NOT part of the mandatory PPE list?":"Yang manakah BUKAN sebahagian daripada senarai PPE wajib?","Bypassing Safety Controls: before overriding a critical alarm you must...":"Memintas Kawalan Keselamatan: sebelum memintas penggera kritikal anda mesti...","Just do it if you're in a hurry":"Buat sahaja jika anda tergesa-gesa","Obtain authorization from the supervisor or issuing authority":"Dapatkan kebenaran daripada penyelia atau pihak berkuasa yang mengeluarkan","Tell a colleague informally":"Maklumkan rakan sekerja secara tidak rasmi","Wait until end of shift":"Tunggu sehingga akhir syif","Confined Space: who must you co
