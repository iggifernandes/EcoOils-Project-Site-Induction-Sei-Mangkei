<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>EcoOils Mentari — HSSE Induction</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');
:root{
  --green:#2F8F52; --green-dark:#1F6B3B; --green-light:#E7F3EC;
  --gold:#F5C518; --gold-dark:#D9A900; --ink:#20241F; --bg:#FFFFFF;
  --card:#F7F9F6; --line:#E1E6DD; --danger:#D6451A; --danger-light:#FBE6DC;
  --muted:#6B7280; --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;overscroll-behavior-y:contain;}
body{background:#EFF2EC;color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding-bottom:40px;}
@media (prefers-reduced-motion: reduce){*{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}}
.topbar{width:100%;background:var(--bg);padding:14px 20px 14px;border-bottom:5px solid var(--gold);position:relative;}
.topbar-inner{max-width:480px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;}
.logo-img{height:42px;object-fit:contain;}
.topbar h1{font-family:'Poppins',sans-serif;font-weight:700;font-size:19px;margin:2px 0 0;text-align:center;}
.topbar .sub{font-size:12px;color:var(--muted);text-align:center;}
.langtoggle{position:absolute;top:14px;right:16px;display:flex;border:1.5px solid var(--line);border-radius:20px;overflow:hidden;}
.langtoggle button{border:none;background:var(--card);color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;padding:6px 10px;cursor:pointer;}
.langtoggle button.active{background:var(--green);color:#fff;}
.progress-wrap{width:100%;max-width:480px;padding:14px 20px 0;}
.progress-track{height:8px;border-radius:5px;background:#DCE3D8;overflow:hidden;}
.progress-fill{height:100%;width:2%;background:var(--green);transition:width .4s cubic-bezier(.4,0,.2,1);}
.progress-text{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);margin-top:5px;text-align:right;}
.stage{width:100%;max-width:480px;padding:18px 20px;}
.card{background:var(--bg);border-radius:var(--radius);border:1px solid var(--line);box-shadow:0 16px 34px -14px rgba(20,30,20,0.25);overflow:hidden;}
.panel{padding:22px;max-height:62vh;overflow-y:auto;}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--green-dark);letter-spacing:0.04em;text-transform:uppercase;margin-bottom:6px;}
.panel h2{font-family:'Poppins',sans-serif;font-weight:700;font-size:20px;margin:0 0 10px;color:var(--ink);}
.panel h3{font-family:'Poppins',sans-serif;font-weight:700;font-size:14.5px;margin:14px 0 6px;color:var(--green-dark);}
.panel p.desc{color:var(--muted);font-size:13.5px;line-height:1.55;margin:0 0 12px;}
.rule-pill{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:10px;margin-bottom:10px;color:#fff;font-family:'Poppins',sans-serif;font-weight:600;font-size:14px;}
.rule-pill b{font-weight:800;margin-right:4px;}
.rule-pill.p1{background:#3E7BC4;} .rule-pill.p2{background:#2FA88A;} .rule-pill.p3{background:#5FA83C;}
ul.rules{margin:0 0 4px;padding-left:0;list-style:none;}
ul.rules li{position:relative;padding:7px 0 7px 24px;font-size:13.5px;line-height:1.5;border-bottom:1px solid var(--line);}
ul.rules li:last-child{border-bottom:none;}
ul.rules li::before{content:"✓";position:absolute;left:0;top:7px;color:var(--green);font-weight:700;font-size:12px;}
ul.rules li.warn::before{content:"✕";color:var(--danger);}
.icon-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.icon-item{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:10px 8px;display:flex;gap:8px;align-items:flex-start;font-size:12px;line-height:1.35;}
.icon-item svg{width:20px;height:20px;flex:0 0 auto;margin-top:1px;}
.icon-item.pos svg{stroke:var(--green);} .icon-item.neg svg{stroke:var(--danger);} .icon-item.info svg{stroke:#3E7BC4;}
.lsr-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px;}
.lsr-item{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:10px 8px;text-align:center;font-size:12px;font-weight:600;color:var(--green-dark);line-height:1.3;}
.lsr-icon-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:10px 0 16px;}
.lsr-icon-tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 6px;text-align:center;}
.lsr-icon-tile svg,.lsr-icon-tile img{width:34px;height:34px;stroke:var(--green);margin-bottom:6px;}
.lsr-icon-tile span{display:block;font-size:11px;font-weight:600;color:var(--green-dark);line-height:1.25;}
.lsr-page-icon{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:10px;overflow:hidden;}
.lsr-page-icon svg,.lsr-page-icon img{width:64px;height:64px;stroke:var(--green-dark);}
.lsr-icon-img{aspect-ratio:1/1;width:100%;height:auto;display:block;object-fit:contain;flex-shrink:0;}
.confirm-gate{display:flex;gap:10px;align-items:flex-start;background:var(--green-light);border:1px solid #CFE7D8;border-radius:10px;padding:12px 14px;margin-top:14px;font-size:13px;line-height:1.4;color:var(--green-dark);cursor:pointer;}
.confirm-gate input{margin-top:2px;width:16px;height:16px;flex:0 0 auto;}
.lsr-rewatch-links{display:flex;gap:10px;margin:6px 0 4px;}
.lsr-rewatch-link{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 6px;text-decoration:none;}
.lsr-rewatch-icon{width:32px;height:32px;display:block;border-radius:50%;overflow:hidden;}
.lsr-rewatch-icon svg,.lsr-rewatch-icon img{width:32px;height:32px;stroke:var(--green);}
.lsr-rewatch-link span:last-child{font-size:11px;font-weight:600;color:var(--green-dark);text-align:center;}
.iogp-box{background:#EEF5FC;border:1px solid #C9DDF2;border-left:5px solid #0B5CAD;border-radius:9px;padding:12px 13px;margin:12px 0;}
.iogp-tag{font-family:'Poppins',sans-serif;font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:#0B5CAD;margin-bottom:4px;}
.iogp-rule{font-family:'Poppins',sans-serif;font-weight:700;font-size:14.5px;color:#0B5CAD;line-height:1.35;margin-bottom:6px;}
.iogp-box ul{margin:0;padding-left:20px;}.iogp-box li{margin:5px 0;font-size:13.5px;line-height:1.45;}.iogp-box ul ul{margin:3px 0 4px;list-style:'– ';padding-left:18px;}
.lesson-box{background:#FFF8DB;border:1px solid #F0DC8A;border-left:5px solid var(--gold-dark);border-radius:9px;padding:11px 12px;font-size:12.5px;color:#5C4A00;margin-top:12px;line-height:1.45;}
.lesson-box b{display:block;font-family:'Poppins',sans-serif;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:#8A6D00;margin-bottom:3px;}
.zt-box{background:var(--danger-light);border:1px solid #F2C2AC;border-radius:9px;padding:11px 12px;font-size:12.5px;color:#7A2A0F;font-weight:600;margin-top:12px;line-height:1.4;}
.video-links{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
.video-links a{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;text-decoration:none;color:var(--ink);font-size:12.5px;font-weight:600;background:var(--card);}
.video-links a svg{width:16px;height:16px;stroke:var(--danger);flex:0 0 auto;}
.contact-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
.contact-row:last-child{border-bottom:none;}
.contact-row .name{font-weight:600;} .contact-row .num{font-family:'IBM Plex Mono',monospace;color:var(--green-dark);text-align:right;}
.contact-group{font-family:'Poppins',sans-serif;font-weight:700;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.03em;margin:12px 0 4px;}
.contact-group:first-child{margin-top:0;}
.dl-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:11px;margin-top:14px;border-radius:8px;border:1.5px dashed var(--green);background:var(--green-light);color:var(--green-dark);font-family:'Poppins',sans-serif;font-weight:700;font-size:13px;cursor:pointer;}
.field{margin-bottom:14px;}
.field label{display:block;font-family:'Poppins',sans-serif;font-weight:600;font-size:12px;letter-spacing:0.01em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}
.field label .req{color:var(--danger);font-size:10px;margin-left:3px;vertical-align:top;}
.required-note{font-size:11px;color:var(--danger);margin:2px 0 14px;font-weight:600;}
.field input, .field select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);font-family:'Inter',sans-serif;font-size:15px;color:var(--ink);}
.field input:focus, .field select:focus, button:focus-visible, .opt:focus-visible{outline:3px solid var(--gold);outline-offset:1px;border-color:var(--green);}
.checkbadge{display:inline-flex;align-items:center;gap:6px;background:var(--green-light);color:var(--green-dark);font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;padding:4px 9px;border-radius:20px;margin-bottom:10px;}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);font-family:'Inter',sans-serif;font-size:13.5px;color:var(--ink);cursor:pointer;transition:border-color .15s;}
.opt:hover{border-color:var(--green);}
.opt.correct{background:var(--green-light);border-color:var(--green);color:var(--green-dark);}
.opt.wrong{background:var(--danger-light);border-color:var(--danger);color:#7A2A0F;}
.opt.disabled{pointer-events:none;}
.feedback{font-size:12.5px;padding:9px 12px;border-radius:8px;margin-top:4px;line-height:1.4;}
.feedback.ok{background:var(--green-light);color:var(--green-dark);} .feedback.bad{background:var(--danger-light);color:#7A2A0F;}
.score-dots{display:flex;gap:5px;margin-top:12px;flex-wrap:wrap;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.dot.hit{background:var(--green);} .dot.miss{background:var(--danger);}
.rule-note{background:var(--green-light);border:1px solid #CFE7D8;border-radius:10px;padding:14px;font-size:13px;color:var(--green-dark);line-height:1.5;margin-bottom:10px;}
.result-fail{text-align:center;padding:6px 0;} .result-fail .big{font-size:38px;margin-bottom:4px;}
.result-pass{text-align:center;}
.cert-frame{border:2px solid var(--gold);outline:6px solid var(--green-light);outline-offset:-10px;position:relative;background:linear-gradient(180deg,#FFFEF9,var(--card));}
.stamp{width:130px;height:130px;margin:4px auto 12px;border:5px solid var(--green);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--green-dark);font-family:'Poppins',sans-serif;font-weight:800;font-size:13px;text-align:center;line-height:1.25;transform:rotate(-12deg) scale(0.4);opacity:0;animation:stampin .5s cubic-bezier(.2,1.6,.4,1) .15s forwards;position:relative;}
.stamp::after{content:"";position:absolute;inset:8px;border:1.5px solid var(--green);border-radius:50%;}
@keyframes stampin{0%{transform:rotate(-12deg) scale(0.4);opacity:0;}60%{transform:rotate(-12deg) scale(1.08);opacity:1;}100%{transform:rotate(-12deg) scale(1);opacity:1;}}
.cert-fields{text-align:left;border-top:1px dashed var(--line);margin-top:6px;padding-top:14px;}
.cf-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line);}
.cf-row .k{color:var(--muted);} .cf-row .v{font-weight:600;text-align:right;}
.gate-note{background:var(--ink);color:#fff;font-family:'Poppins',sans-serif;font-weight:600;font-size:12.5px;text-align:center;padding:10px;border-radius:8px;margin-top:12px;letter-spacing:0.02em;}
.selfie-frame{width:100%;max-width:320px;aspect-ratio:3/4;margin:14px auto;border-radius:14px;overflow:hidden;background:#111;position:relative;}
.selfie-thumb{display:block;width:150px;height:150px;object-fit:cover;border-radius:14px;border:3px solid var(--gold);margin:14px auto 0;}
.selfie-frame video, .selfie-frame img{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);}
.warm-msg{text-align:center;margin-top:20px;padding-top:18px;border-top:1px dashed var(--line);}
.warm-msg-logo{width:120px;margin:0 auto 12px;display:block;}
.warm-msg-title{font-family:'Poppins',sans-serif;font-weight:700;font-size:16px;color:var(--green-dark);margin:0 0 8px;}
.warm-msg-text{font-size:13px;line-height:1.55;color:var(--ink);margin:0 0 10px;max-width:400px;margin-left:auto;margin-right:auto;}
.warm-msg-motto{font-family:'Poppins',sans-serif;font-weight:700;font-size:13.5px;color:var(--gold-dark);margin:0;}
.safety-notice{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);}
.safety-notice p{color:var(--danger);font-style:italic;font-size:11.5px;line-height:1.5;text-align:center;margin:0 0 8px;}
.safety-notice p:last-child{margin-bottom:0;}
.foot{display:flex;gap:10px;padding:0 22px 22px;}
button.btn{flex:1;padding:13px 16px;border-radius:8px;border:none;font-family:'Poppins',sans-serif;font-weight:700;font-size:14.5px;letter-spacing:0.01em;cursor:pointer;transition:filter .15s, transform .05s;}
button.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--green);color:#fff;} .btn-primary:hover{filter:brightness(1.08);}
.btn-primary:disabled{background:#C6D3C6;color:#8B978B;cursor:not-allowed;}
.btn-ghost{background:transparent;color:var(--muted);border:1.5px solid var(--line);} .btn-ghost:hover{border-color:var(--muted);}
.btn-alert{background:var(--danger);color:#fff;}
.footer-note{color:#7C877B;font-size:11px;text-align:center;max-width:440px;margin-top:14px;line-height:1.5;padding:0 20px;}
</style>
</head>

function lsrIcon(key){
  const b64 = LSR_ICON_B64[key];
  if(b64) return `<img src="data:image/png;base64,${b64}" alt="${key}" class="lsr-icon-img">`;
  const s='stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"';
  return `<svg viewBox="0 0 24 24" ${s}></svg>`;
}

/* ============ CONTENT SECTIONS (bilingual) ============ */
function ul(items,lang){ return '<ul class="rules">'+items.map(i=>{const c=i.warn?' class="warn"':''; return `<li${c}>${i[lang]}</li>`;}).join('')+'</ul>'; }
function iconGrid(items,lang){
  return '<div class="icon-grid">'+items.map(i=>{
    const cls = i.type==='neg'?'neg':(i.type==='info'?'info':'pos');
    const ic = i.type==='neg'?'ban':(i.type==='info'?'alert':'check');
    return `<div class="icon-item ${cls}">${icon(ic)}<span>${i[lang]}</span></div>`;
  }).join('')+'</div>';
}

function addToSection(tagEn, fn){
  const sec = sections.find(x=>x.tag.en===tagEn); if(!sec) return;
  const orig = sec.bodyFn; sec.bodyFn = (lang)=>fn(orig(lang), lang);
}
const lessonBox = (lang, txt)=> `<div class="lesson-box"><b>${lang==='en'?'Lesson from our site':'Pelajaran dari site kami'}</b>${txt[lang]}</div>`;
function addLesson(tagEn, txt, beforeZT){
  addToSection(tagEn, (h,lang)=> (beforeZT && h.includes('<div class="zt-box">'))
    ? h.replace('<div class="zt-box">', lessonBox(lang,txt)+'<div class="zt-box">')
    : h + lessonBox(lang,txt));
}

/* ============ QUESTION BANK (60) ============
   10 MANDATORY slots (each has an A and B version; a candidate sees A first, B on a retry)
   + 40-question random POOL. Each paper = 10 mandatory + 10 random (20 total), shuffled together.
   Random picks: 6 guaranteed (one each from Bypassing, Driving, Energy Isolation, Hot Work, Line of Fire,
   Work Authorisation) + 4 fully random. A candidate never sees the same random question twice.
   Correct answer is listed FIRST in mkc(); options are shuffled at paper-build time. */
const O_ = (en,id)=>({en,id});
function mkc(id, topic, group, qEn, qId, correct, wrongs){
  return { id, topic, group:group||null, q:{en:qEn,id:qId}, opts:[correct,...wrongs].map(x=>O_(x[0],x[1])), correct:0, fixed:false };
}
function mkf(id, topic, group, qEn, qId, opts, correct){   // fixed order (numbers, True/False)
  return { id, topic, group:group||null, q:{en:qEn,id:qId}, opts:opts.map(x=>O_(x[0],x[1])), correct, fixed:true };
}
function fromLegacy(i, id, topic, group, fixed){
  const L = legacyQ[i]; return { id, topic, group:group||null, q:L.q, opts:L.opts, correct:L.correct, fixed:!!fixed };
}

function seenKey(){ const id=(state.visitor.idnum||'anon').toLowerCase().replace(/[^a-z0-9]/g,''); return 'mhi_seen_v1:'+(id||'anon'); }
function loadSeen(){
  const s = new Set(state.seenIds||[]);
  try{ const raw=localStorage.getItem(seenKey()); if(raw) JSON.parse(raw).forEach(x=>s.add(x)); }catch(e){}
  return s;
}
function saveSeen(set){
  state.seenIds = Array.from(set);
  try{ localStorage.setItem(seenKey(), JSON.stringify(state.seenIds)); }catch(e){}
}
function shuffleArr(a){ const r=a.slice(); for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; }
function randOf(a){ return a[Math.floor(Math.random()*a.length)]; }
function prepareQ(q){
  let opts = q.opts.map((o,i)=>({o,i}));
  if(!q.fixed) opts = shuffleArr(opts);
  return { id:q.id, q:q.q, opts:opts.map(x=>x.o), correct:opts.findIndex(x=>x.i===q.correct) };
}
const PAPER_SIZE = 20, PASS_PCT = 0.8, GUARANTEED_GROUPS = ['bypass','driving','energy','hotwork','lof','workauth'];
function buildPaper(){
  const seen = loadSeen(), usedIds = new Set(), usedTopics = new Set(), paper = [];
  MANDATORY.forEach(slot=>{
    const unseen = [slot.a, slot.b].filter(q=>!seen.has(q.id));
    const pick = unseen.length ? unseen[0] : randOf([slot.a, slot.b]);
    paper.push(pick); usedIds.add(pick.id); usedTopics.add(pick.topic);
  });
  const pickFrom = (cands)=>{
    let c = cands.filter(q=>!usedIds.has(q.id) && !usedTopics.has(q.topic) && !seen.has(q.id));
    if(!c.length) c = cands.filter(q=>!usedIds.has(q.id) && !usedTopics.has(q.topic));   // pool exhausted: allow a repeat only as a last resort
    if(!c.length) return null;
    const p = randOf(c); paper.push(p); usedIds.add(p.id); usedTopics.add(p.topic); return p;
  };
  GUARANTEED_GROUPS.forEach(g=> pickFrom(POOL.filter(q=>q.group===g)));
  // the 4 fully random picks come only from questions outside the six guaranteed rule groups, so a retry still has a fresh question for every rule
  const freeQs = POOL.filter(q=>!q.group);
  while(paper.length < PAPER_SIZE){ if(!pickFrom(freeQs)) break; }
  while(paper.length < PAPER_SIZE){ if(!pickFrom(POOL)) break; }
  while(paper.length < PAPER_SIZE){ const rest = POOL.filter(q=>!usedIds.has(q.id)); if(!rest.length) break; const p=randOf(rest); paper.push(p); usedIds.add(p.id); }
  paper.forEach(q=>seen.add(q.id)); saveSeen(seen);
  finalQuestions = shuffleArr(paper).map(prepareQ);
  PASS_MARK = Math.ceil(finalQuestions.length * PASS_PCT);
}

function formatDuration(ms){

}

const UPLOAD_PENDING_KEY = 'mhi_pending_v1';
async function certToDataUrl(){
  const canvas = await genCertificateCanvas();
  for(const q of [0.85, 0.7, 0.55]){ const u = canvas.toDataURL('image/jpeg', q); if(u.length < 3500000) return u; }

function setUploadStatus(st){

  const L = UI[state.lang];

  el.style.color = st==='fail' ? 'var(--danger)' : 'var(--green-dark)';

async function postOnce(payload){
  const ctrl = new AbortController(); const t = setTimeout(()=>ctrl.abort(), 45000);
  try{
    const res = await fetch(GOOGLE_SHEET_WEBHOOK_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload), signal: ctrl.signal });
    const j = await res.json();
    return !!(j && j.ok);
  }catch(e){ return false; }
  finally{ clearTimeout(t); }
}
async function sendRecordToSheet(payload){
  setUploadStatus('pending');
  queuePending(payload);                       // kept until the server confirms, so a refresh mid-upload cannot lose it
  const waits = [0, 5000, 15000, 40000];        // first try + 3 retries for weak signal
  for(const w of waits){
    if(w) await new Promise(r=>setTimeout(r, w));
    if(await postOnce(payload)){ dequeuePending(payload.certNumber); setUploadStatus('ok'); return; }
  }
  setUploadStatus('fail');
}
function dequeuePending(cn){
  try{ const list = JSON.parse(localStorage.getItem(UPLOAD_PENDING_KEY)||'[]').filter(p=>p.certNumber!==cn);
    if(list.length) localStorage.setItem(UPLOAD_PENDING_KEY, JSON.stringify(list)); else localStorage.removeItem(UPLOAD_PENDING_KEY); }catch(e){}
}
function queuePending(payload){
  try{
    const list = JSON.parse(localStorage.getItem(UPLOAD_PENDING_KEY)||'[]').filter(p=>p.certNumber!==payload.certNumber);
    list.push(payload); localStorage.setItem(UPLOAD_PENDING_KEY, JSON.stringify(list.slice(-2)));
  }catch(e){}
}
async function flushPending(){                   // runs when the page is opened again on the same phone
  if(!GOOGLE_SHEET_WEBHOOK_URL) return;
  let list=[]; try{ list = JSON.parse(localStorage.getItem(UPLOAD_PENDING_KEY)||'[]'); }catch(e){ return; }
  if(!list.length) return;
  const left=[]; for(const p of list){ if(await postOnce(p)){ if(p.certNumber===certNumber) setUploadStatus('ok'); } else { left.push(p); if(p.certNumber===certNumber) setUploadStatus('fail'); } }
  try{ if(left.length) localStorage.setItem(UPLOAD_PENDING_KEY, JSON.stringify(left)); else localStorage.removeItem(UPLOAD_PENDING_KEY); }catch(e){}
}
function recordsToCSV(records){
  const headers = ["Certificate No","Name","Company","ID/Passport","Host/Contractor","Host Contact Name","Host Contact Phone","Purpose","Details Certified","Health Cert Submitted","Score","Total Questions","Percentage","Passed","Attempts Taken","Start Time","Completion Time","Duration"];
  const rows = records.map(r=>[
    r.certNumber, r.name, r.company, r.idnum, r.host, r.hostName, r.hostPhone, r.purpose,
    r.certify ? "Yes" : "No", r.healthCert==='yes' ? "Yes" : (r.healthCert==='no' ? "No" : ""),
    r.score, r.totalQuestions, r.percentage+"%", r.passed ? "Pass" : "Fail", r.attemptsTaken ?? "",
    r.startTime, r.completionTime, r.durationLabel
  ]);
  const esc = (val)=>{ const s = String(val ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
  return [headers, ...rows].map(row=>row.map(esc).join(",")).join("\r\n");
}

function roundRect(ctx,x,y,w,h,r){

  ctx.closePath();
}

  ctx.save(); ctx.globalAlpha=0.055; ctx.fillStyle="#1F6B3B"; ctx.font="800 24px Poppins, sans-serif"; ctx.textAlign="center";
  ctx.translate(cw/2, ch/2); ctx.rotate(-Math.PI/6);
  for(let wy=-ch; wy<=ch; wy+=96){ ctx.fillText("INDUCTION COMPLETION RECORD · NOT PROOF OF EMPLOYMENT", 0, wy); }
  ctx.restore();

  const logo = await loadLogoImg();
  const logoW = 240, logoH = logoW*(logo.height/logo.width);
  ctx.drawImage(logo, (cw-logoW)/2, 58, logoW, logoH);

  if(state.selfieDataUrl){
    const selfieImg = await new Promise(res=>{ const im=new Image(); im.onload=()=>res(im); im.src=state.selfieDataUrl; });
    const photoSize = 150, photoX = cw-margin-30-photoSize, photoY = 58, photoR = 16;
    ctx.save();
    roundRect(ctx, photoX, photoY, photoSize, photoSize, photoR); ctx.clip();
    const side = Math.min(selfieImg.width, selfieImg.height);
    const sx=(selfieImg.width-side)/2, sy=(selfieImg.height-side)/2;
    ctx.drawImage(selfieImg, sx, sy, side, side, photoX, photoY, photoSize, photoSize);
    ctx.restore();
    ctx.lineWidth=3; ctx.strokeStyle="#F5C518";
    roundRect(ctx, photoX, photoY, photoSize, photoSize, photoR); ctx.stroke();
  } else {
    // No photo present — make this visibly obvious rather than silently omitting it, so any tampering
    // attempt (e.g. bypassing the capture step via devtools) is immediately flagged on the certificate itself.
    const photoSize = 150, photoX = cw-margin-30-photoSize, photoY = 58, photoR = 16;
    ctx.save();
    roundRect(ctx, photoX, photoY, photoSize, photoSize, photoR); ctx.fillStyle="#FBE7E1"; ctx.fill();
    ctx.lineWidth=3; ctx.strokeStyle="#C0392B";
    roundRect(ctx, photoX, photoY, photoSize, photoSize, photoR); ctx.stroke();
    ctx.fillStyle="#C0392B"; ctx.font="700 13px Poppins, sans-serif"; ctx.textAlign="center";
    ctx.fillText("NO", photoX+photoSize/2, photoY+photoSize/2-6); ctx.fillText("PHOTO", photoX+photoSize/2, photoY+photoSize/2+12);
    ctx.restore();
    ctx.textAlign="left";
  }

  let y = 58+logoH+46;
  ctx.textAlign="center";
  // stamp circle
  ctx.beginPath(); ctx.arc(cw/2, y+70, 70, 0, Math.PI*2); ctx.lineWidth=5; ctx.strokeStyle="#2F8F52"; ctx.stroke();
  ctx.beginPath(); ctx.arc(cw/2, y+70, 60, 0, Math.PI*2); ctx.lineWidth=1.5; ctx.strokeStyle="#2F8F52"; ctx.stroke();
  ctx.font="800 16px Poppins, sans-serif"; ctx.fillStyle="#1F6B3B";
  ctx.fillText(L.stampLine1, cw/2, y+62);
  ctx.fillText(L.stampLine2, cw/2, y+84);
  y += 168;

  ctx.font="700 22px Poppins, sans-serif"; ctx.fillStyle="#20241F";
  wrapCenteredText(ctx, L.passTitle, cw/2, y, cw-140, 28); y += (measureWrapLines(ctx, L.passTitle, cw-140)*28) + 14;
  ctx.font="500 14px Inter, sans-serif"; ctx.fillStyle="#6B7280";
  ctx.fillText(L.passScore(state.score,finalQuestions.length,PASS_MARK), cw/2, y); y += 36;

  ctx.textAlign="left";
  const rows=[[L.certNo,certNumber],[L.nameF,v.name||'—'],[L.companyF,v.company||'—'],[L.idF,v.idnum||'—'],
    [L.hostF,v.host||'—'],[L.fHostName,v.hostName||'—'],[L.fHostPhone,v.hostPhone||'—'],[L.purposeF,v.purpose||'—'],
    [L.durationF,durationLabel],[L.attemptsF,String(state.attempts+1)],[L.issuedF,dateStr+", "+timeStr]];
  const rowLeft=70, rowRight=cw-70;
  rows.forEach(r=>{
    ctx.strokeStyle="#E1E6DD"; ctx.beginPath(); ctx.moveTo(rowLeft,y+16); ctx.lineTo(rowRight,y+16); ctx.stroke();
    ctx.font="500 14px Inter, sans-serif"; ctx.fillStyle="#6B7280"; ctx.fillText(r[0], rowLeft, y);
    ctx.font="700 14px Inter, sans-serif"; ctx.fillStyle="#20241F"; ctx.textAlign="right";
    ctx.fillText(String(r[1]), rowRight, y); ctx.textAlign="left";
    y+=42;
  });

  y += 18;
  ctx.fillStyle="#20241F"; roundRect(ctx, rowLeft-4, y, (rowRight-rowLeft)+8, bandH, 8); ctx.fill();
  ctx.font="700 12.5px Poppins, sans-serif"; ctx.textAlign="center";
  const bandW = (rowRight-rowLeft)-28, enN = measureWrapLines(ctx, UI.en.showGate, bandW);
  ctx.fillStyle="#F5C518"; wrapCenteredText(ctx, UI.en.showGate, cw/2, y+23, bandW, 17);
  ctx.fillStyle="#FFFFFF"; wrapCenteredText(ctx, UI.id.showGate, cw/2, y+23+enN*17+4, bandW, 17);
  y += bandH + 30;

  ctx.textAlign="center";
  ctx.font="700 15px Poppins, sans-serif"; ctx.fillStyle="#1F6B3B";
  ctx.fillText(L.warmTitle, cw/2, y); y += 26;
  ctx.font="400 12.5px Inter, sans-serif"; ctx.fillStyle="#20241F";
  const textLines = measureWrapLines(ctx, L.warmText, cw-140);
  wrapCenteredText(ctx, L.warmText, cw/2, y, cw-140, 19); y += textLines*19 + 14;
  ctx.font="700 13px Poppins, sans-serif"; ctx.fillStyle="#D9A900";
  ctx.fillText("🧡 " + L.warmMotto, cw/2, y);
  y += 34;

  ctx.strokeStyle="#E1E6DD"; ctx.beginPath(); ctx.moveTo(70,y); ctx.lineTo(cw-70,y); ctx.setLineDash([4,4]); ctx.stroke(); ctx.setLineDash([]);
  y += 22;
  ctx.font="italic 400 11px Inter, sans-serif"; ctx.fillStyle="#C0392B";
  const noticeMaxW = cw-140;
  const enLines = measureWrapLines(ctx, SAFETY_NOTICE_EN, noticeMaxW);
  wrapCenteredText(ctx, SAFETY_NOTICE_EN, cw/2, y, noticeMaxW, 16); y += enLines*16 + 12;
  const idLines = measureWrapLines(ctx, SAFETY_NOTICE_ID, noticeMaxW);
  wrapCenteredText(ctx, SAFETY_NOTICE_ID, cw/2, y, noticeMaxW, 16);

  ctx.restore();
  return canvas;
}
function measureWrapLines(ctx, text, maxWidth){
  const words = text.split(' '); let line=''; let lines=1;
  words.forEach(word=>{
    const test = line ? line+' '+word : word;
    if(ctx.measureText(test).width > maxWidth && line){ lines++; line=word; } else { line=test; }
  });
  return lines;
}
function wrapCenteredText(ctx, text, cx, startY, maxWidth, lineHeight){
  const words = text.split(' '); let line=''; let y=startY;
  words.forEach(word=>{
    const test = line ? line+' '+word : word;
    if(ctx.measureText(test).width > maxWidth && line){ ctx.fillText(line, cx, y); line=word; y+=lineHeight; } else { line=test; }
  });
  if(line) ctx.fillText(line, cx, y);
}
async function downloadCertPNG(){
  const canvas = await genCertificateCanvas();
  triggerDownload(canvas, `eco-oils-mentari-certificate-${certNumber||'induction'}.png`);
}
async function shareCertPNG(){
  const canvas = await genCertificateCanvas();
  canvas.toBlob(async (blob)=>{
    const file = new File([blob], `eco-oils-mentari-certificate-${certNumber||'induction'}.png`, {type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file], title:'EcoOils Mentari Induction Certificate'}); return; }catch(e){ /* user cancelled or share failed, fall back to download */ }
    }
    triggerDownload(canvas, `eco-oils-mentari-certificate-${certNumber||'induction'}.png`);
  }, 'image/png');
}

/* ============ BINDING ============ */
function bind(){
  document.getElementById('btnEn').onclick = ()=>{ state.lang='en'; render(); };
  document.getElementById('btnId').onclick = ()=>{ state.lang='id'; render(); };

  if(isAdminMode){
    const adminLoginBtn = document.getElementById('adminLoginBtn');
    if(adminLoginBtn) adminLoginBtn.onclick = ()=>{
      const pw = document.getElementById('adminPasswordInput').value;
      if(pw === ADMIN_PASSWORD){ adminAuthed = true; render(); }
      else { document.getElementById('adminLoginError').style.display = 'block'; }
    };
    const adminPwInput = document.getElementById('adminPasswordInput');
    if(adminPwInput) adminPwInput.onkeydown = (e)=>{ if(e.key==='Enter') document.getElementById('adminLoginBtn').click(); };
    const adminExportBtn = document.getElementById('adminExportBtn');
    if(adminExportBtn) adminExportBtn.onclick = exportRecordsCSV;
    return;
  }

  const startBtn = document.getElementById('startBtn');
  if(startBtn) startBtn.onclick = ()=>{ state.startTime = Date.now(); state.pos++; render(); };

  const backBtn = document.getElementById('backBtn');
  if(backBtn) backBtn.onclick = ()=>{ state.pos = Math.max(0, state.pos-1); render(); };

  const f = flow[state.pos];

  if(f.type==='details'){
    const isValidPhone = (val)=>{
      const digits = val.trim().replace(/[\s()-]/g,'');
      return /^\+?[0-9]{7,15}$/.test(digits);
    };
    const recalc = ()=>{
      const v = state.visitor;
      const phoneOk = isValidPhone(v.hostPhone);
      const errEl = document.getElementById('hostPhoneError');
      if(errEl) errEl.style.display = (v.hostPhone.trim() && !phoneOk) ? 'block' : 'none';
      const ready = v.name.trim() && v.company.trim() && v.idnum.trim() && v.host && v.hostName.trim() && phoneOk && v.purpose.trim() && v.certify && v.healthCert;
      document.getElementById('nextBtn').disabled = !ready;
    };
    ['f_name','f_company','f_id','f_host','f_hostname','f_hostphone','f_purpose'].forEach(id=>{
      const el = document.getElementById(id);
      el.oninput = el.onchange = ()=>{
        const map={f_name:'name',f_company:'company',f_id:'idnum',f_host:'host',f_hostname:'hostName',f_hostphone:'hostPhone',f_purpose:'purpose'};
        state.visitor[map[id]] = el.value;
        recalc();
      };
    });
    const certifyEl = document.getElementById('f_certify');
    if(certifyEl) certifyEl.onchange = ()=>{ state.visitor.certify = certifyEl.checked; recalc(); };
    document.querySelectorAll('input[name="f_health"]').forEach(r=>{
      r.onchange = ()=>{ if(r.checked) state.visitor.healthCert = r.value; recalc(); };
    });
    const nextBtn = document.getElementById('nextBtn');
    if(nextBtn) nextBtn.onclick = ()=>{ state.pos++; render(); };
  }

  if(f.type==='content'){
    const nextBtn = document.getElementById('nextBtn');
    if(nextBtn) nextBtn.onclick = ()=>{ state.pos++; render(); };
    const dlContactsBtn = document.getElementById('dlContactsBtn');
    if(dlContactsBtn) dlContactsBtn.onclick = downloadContactsPNG;
    const sec = sections[f.idx];
    if(sec && sec.confirmGate){
      const cb = document.getElementById('confirmGateInput');
      if(cb){
        cb.checked = !!state.lsrConfirmed[f.idx];
        cb.onchange = ()=>{ state.lsrConfirmed[f.idx] = cb.checked; if(nextBtn) nextBtn.disabled = !cb.checked; if(cb.checked) autoSaveLsrCard(sec); };
      }
    }
  }

  if(f.type==='check'){
    document.querySelectorAll('.opt').forEach(btn=>{
      btn.onclick = ()=>{ const idx=parseInt(btn.dataset.idx); state.secAnswers[f.idx]=idx; render(); };
    });
    const nextBtn = document.getElementById('nextBtn');
    if(nextBtn) nextBtn.onclick = ()=>{ state.pos++; render(); };
  }

  if(f.type==='assessment-intro'){
    const startQuizBtn = document.getElementById('startQuizBtn');
    if(startQuizBtn) startQuizBtn.onclick = ()=>{ if(!state.paperBuilt){ buildPaper(); state.paperBuilt = true; } state.pos++; state.qIndex=0; render(); };
  }

  if(f.type==='quiz'){
    document.querySelectorAll('.opt').forEach(btn=>{
      btn.onclick = ()=>{
        const idx=parseInt(btn.dataset.idx), i=state.qIndex;
        if(state.qAnswers[i]!==undefined) return;
        state.qAnswers[i]=idx; if(idx===finalQuestions[i].correct) state.score++;
        render();
      };
    });
    const backQBtn = document.getElementById('backQBtn');
    if(backQBtn) backQBtn.onclick = ()=>{ if(state.qIndex>0){ state.qIndex--; render(); } else { state.pos--; render(); } };
    const nextQBtn = document.getElementById('nextQBtn');
    if(nextQBtn) nextQBtn.onclick = ()=>{
      if(state.qIndex < finalQuestions.length-1){ state.qIndex++; render(); }
      else {
        if(state.score < PASS_MARK){ state.attempts++; state.pos = flow.findIndex(x=>x.type==='result'); }
        else { state.pos = flow.findIndex(x=>x.type==='selfie'); }
        render();
      }
    };
  }

  if(f.type==='selfie'){
    const videoEl = document.getElementById('selfieVideo');
    const previewEl = document.getElementById('selfiePreview');
    const canvasEl = document.getElementById('selfieCanvas');
    const captureBtn = document.getElementById('selfieCaptureBtn');
    const retakeBtn = document.getElementById('selfieRetakeBtn');
    const continueBtn = document.getElementById('selfieContinueBtn');
    const retryBtn = document.getElementById('selfieRetryBtn');
    const errorEl = document.getElementById('selfieError');
    const consentCheck = document.getElementById('selfieConsentCheck');
    let stream = null;

    function stopStream(){ if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } }

    function startCamera(){
      if(errorEl) errorEl.style.display='none';
      if(retryBtn) retryBtn.style.display='none';
      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
        if(errorEl) errorEl.style.display='block';
        if(retryBtn) retryBtn.style.display='block';
        return;
      }
      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio:false }).then(s=>{
        stream = s;
        if(videoEl) videoEl.srcObject = s;
      }).catch(()=>{
        if(errorEl) errorEl.style.display='block';
        if(retryBtn) retryBtn.style.display='block';
      });
    }
    // Camera access is only requested after the consent checkbox is explicitly ticked — never before.
    if(state.selfieConsent && !state.selfieDataUrl) startCamera();

    if(consentCheck) consentCheck.onchange = ()=>{
      state.selfieConsent = consentCheck.checked;
      if(!consentCheck.checked){ state.selfieDataUrl = null; } // withdrawing consent discards any captured photo too
      render();
    };
    if(retryBtn) retryBtn.onclick = startCamera;
    if(captureBtn) captureBtn.onclick = ()=>{
      if(!videoEl || !videoEl.videoWidth) return;
      canvasEl.width = videoEl.videoWidth; canvasEl.height = videoEl.videoHeight;
      const ctx = canvasEl.getContext('2d');
      ctx.translate(canvasEl.width,0); ctx.scale(-1,1); // un-mirror so the saved photo reads correctly
      ctx.drawImage(videoEl, 0, 0, canvasEl.width, canvasEl.height);
      state.selfieDataUrl = canvasEl.toDataURL('image/jpeg', 0.9);
      stopStream();
      render();
    };
    if(retakeBtn) retakeBtn.onclick = ()=>{ state.selfieDataUrl = null; render(); };
    if(continueBtn) continueBtn.onclick = ()=>{
      stopStream();
      certNumber = genCertNumber(); recordSubmission();
      state.pos = flow.findIndex(x=>x.type==='result');
      render();
    };
  }

  if(f.type==='result'){
    const resitBtn = document.getElementById('resitBtn');
    if(resitBtn) resitBtn.onclick = ()=>{
      if(autoRestartTimer){ clearTimeout(autoRestartTimer); autoRestartTimer=null; }
      state.qIndex=0; state.score=0; state.qAnswers={}; state.secAnswers={}; state.lsrConfirmed={}; state.selfieDataUrl=null; state.selfieConsent=false; state.paperBuilt=false;
      state.pos = flow.findIndex(x=>x.type==='content');
      render();
    };
    if(resitBtn && state.score < PASS_MARK){
      autoRestartTimer = setTimeout(()=>{ if(resitBtn) resitBtn.click(); }, 6000);
    }
    const dlCertBtn = document.getElementById('dlCertBtn');
    if(dlCertBtn) dlCertBtn.onclick = downloadCertPNG;
    const shareCertBtn = document.getElementById('shareCertBtn');
    if(shareCertBtn) shareCertBtn.onclick = shareCertPNG;
    if(state.score >= PASS_MARK && !state.certAutoDownloaded){
      state.certAutoDownloaded = true;
      downloadCertPNG().then(()=>{
        const note = document.getElementById('certSavedNote');
        if(note) note.style.display = 'block';
      });
    }
    const restartBtn = document.getElementById('restartBtn');
    if(restartBtn) restartBtn.onclick = ()=>{
      state.paperBuilt=false; state.seenIds=[]; state.lsrCardSaved={}; state.uploadStatus=''; state.pos=0; state.qIndex=0; state.score=0; state.attempts=0; state.qAnswers={}; state.secAnswers={}; state.lsrConfirmed={};
      state.visitor={name:"",company:"",host:"",hostName:"",hostPhone:"",idnum:"",purpose:"",certify:false,healthCert:""}; certNumber=""; state.startTime=0; state.recorded=false; state.certAutoDownloaded=false; state.selfieDataUrl=null; state.selfieConsent=false;
      render();
    };
  }
}

/* ============ KEEP PROGRESS WHEN THE PAGE IS REFRESHED (pull-down, reload, tab restored) ============ */
const SAVE_KEY = 'mhi_progress_v1', BUILD_ID = '2026-10-06', SAVE_MAX_AGE = 6*3600*1000;
const LOCAL_SAVE_KEY = 'mhi_progress_local_v1', LOCAL_MAX_AGE = 3*3600*1000;
let resumeOffer = null;
function saveProgress(){
  if(isAdminMode || resumeOffer) return;
  const snap = (withSelfie)=>JSON.stringify({ build:BUILD_ID, t:Date.now(), certNumber, PASS_MARK, finalQuestions,
    state:Object.assign({}, state, withSelfie ? {} : {selfieDataUrl:null}) });
  try{ sessionStorage.setItem(SAVE_KEY, snap(true)); }
  catch(e){ try{ sessionStorage.setItem(SAVE_KEY, snap(false)); }catch(e2){} }   // storage full: keep progress, drop the photo
  // second copy on this phone, for when the browser (or an in-app browser) drops the tab while a video is open
  try{
    const f = flow[state.pos];
    if(f && f.type==='result'){ localStorage.removeItem(LOCAL_SAVE_KEY); }          // finished: nothing left to resume
    else if(state.pos >= 2){ try{ localStorage.setItem(LOCAL_SAVE_KEY, snap(true)); }catch(e){ localStorage.setItem(LOCAL_SAVE_KEY, snap(false)); } }
  }catch(e){}
}
function applySnap(snap){
  Object.assign(state, snap.state);
  certNumber = snap.certNumber || ''; finalQuestions = snap.finalQuestions || []; PASS_MARK = snap.PASS_MARK || PASS_MARK;
}
function validSnap(snap){ return !!(snap && snap.build===BUILD_ID && snap.state && snap.state.pos < flow.length); }
function maskName(n){ n = String(n||'').trim(); return n ? n.charAt(0)+'•••' : '—'; }
function viewResumeOffer(snap){
  const v = snap.state.visitor || {}; const id = String(v.idnum||''); const idm = id.length>2 ? ' · ••••'+id.slice(-2) : '';
  return `<div class="panel"><div class="eyebrow">EcoOils — Mentari Project</div><h2>Continue your induction? / Lanjutkan induksi Anda?</h2>
    <p class="desc"><b>${maskName(v.name)}${idm}</b><br>An induction is in progress on this phone. / Ada induksi yang sedang berjalan di ponsel ini.</p></div>
    <div class="foot"><button class="btn btn-ghost" id="resumeNewBtn">Start new / Mulai baru</button><button class="btn btn-primary" id="resumeContinueBtn">Continue / Lanjutkan</button></div>`;
}
function loadProgress(){
  if(isAdminMode) return;
  try{                                                   // 1) same tab reloaded: restore silently
    const raw = sessionStorage.getItem(SAVE_KEY);
    if(raw){ const snap = JSON.parse(raw); if(validSnap(snap) && Date.now()-snap.t <= SAVE_MAX_AGE){ applySnap(snap); return; } sessionStorage.removeItem(SAVE_KEY); }
  }catch(e){ try{ sessionStorage.removeItem(SAVE_KEY); }catch(e2){} }
  try{                                                   // 2) tab was dropped (e.g. after a YouTube app): offer to continue
    const raw = localStorage.getItem(LOCAL_SAVE_KEY);
    if(raw){ const snap = JSON.parse(raw); if(validSnap(snap) && snap.state.pos >= 2 && Date.now()-snap.t <= LOCAL_MAX_AGE){ resumeOffer = snap; return; } localStorage.removeItem(LOCAL_SAVE_KEY); }
  }catch(e){ try{ localStorage.removeItem(LOCAL_SAVE_KEY); }catch(e2){} }
}
// typed answers on the details form are saved as they are typed, and again when the page is hidden or closed
document.addEventListener('input', saveProgress); document.addEventListener('change', saveProgress);
window.addEventListener('pagehide', saveProgress);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') saveProgress(); });

loadProgress();
render();
flushPending();
</script>
