height":"Lindungi diri anda daripada jatuh semasa bekerja di tempat tinggi","Established more than 40 years ago, EcoOils is a regional leading waste oil manufacturer. EcoOils deploys cutting-edge recycling technology to divert waste from landfills, generating spent bleaching earth oil (SBEO) and other ISCC-certified biofuel feedstocks.":"Ditubuhkan lebih 40 tahun lalu, EcoOils ialah pengeluar minyak buangan terkemuka di rantau ini. EcoOils menggunakan teknologi kitar semula termaju untuk mengelakkan sisa daripada tapak pelupusan, menghasilkan minyak tanah liat peluntur terpakai (SBEO) dan bahan mentah biobahan api lain yang diperakui ISCC.","PT EcoOils Jaya Indonesia, Sei Mangkei is constructing the 3rd SBEO processing plant in Indonesia":"PT EcoOils Jaya Indonesia, Sei Mangkei sedang membina loji pemprosesan SBEO ke-3 di Indonesia","with the law, standards and procedures":"kepada undang-undang, piawaian dan prosedur","in unsafe or non-compliant situations":"dalam situasi yang tidak selamat atau tidak patuh","our local community & neighbours":"komuniti setempat & jiran kami","In any emergency:":"Dalam sebarang kecemasan:","make the place safe, and leave the location promptly and safely.":"pastikan tempat itu selamat, dan tinggalkan lokasi dengan segera dan selamat.","Identify exits:":"Kenal pasti pintu keluar:","locate the nearest primary and secondary emergency exits — never use elevators":"cari pintu keluar kecemasan utama dan sekunder yang terdekat — jangan sekali-kali menggunakan lif","Stay calm:":"Bertenang:","move quickly and orderly without running, to avoid trips, falls or crowd crush":"bergerak dengan pantas dan teratur tanpa berlari, untuk mengelakkan tersandung, jatuh atau berasak-asak","Leave belongings:":"Tinggalkan barang:","abandon non-essential items immediately":"tinggalkan serta-merta barang yang tidak penting","Assist others:":"Bantu orang lain:","help those with mobility issues if it's safe to do so":"bantu mereka yang mempunyai masalah pergerakan jika selamat untuk berbuat demikian","Report to assembly:":"Lapor diri di tempat berhimpun:","head to the designated safe zone and check in for a head count":"pergi ke zon selamat yang ditetapkan dan daftar masuk untuk pengiraan kehadiran","General Emergency Numbers":"Nombor Kecemasan Am","Hospitals — Sei Mangkei":"Hospital — Sei Mangkei","Hospitals — Medan":"Hospital — Medan","Please dispose of all waste in the designated waste bins. Help us maintain a clean and organized work environment.":"Sila buang semua sisa dalam tong sisa yang ditetapkan. Bantu kami mengekalkan persekitaran kerja yang bersih dan teratur.","Any work activity above 1.8 meters requires appropriate fall prevention or fall protection measures based on a risk assessment (e.g., harnesses, guardrails, lifelines). Ensure that all scaffolds and height access equipment have been inspected and are safe to use.":"Sebarang aktiviti kerja melebihi 1.8 meter memerlukan langkah pencegahan jatuh atau perlindungan jatuh yang sesuai berdasarkan penilaian risiko (contohnya, harness, pagar pelindung, tali penyelamat). Pastikan semua perancah dan peralatan akses ketinggian telah diperiksa dan selamat digunakan.","Do not enter or cross any excavated areas without explicit authorization. These areas have potential risks such as collapses, falling materials, and falls. Entry is prohibited without proper authorization and safety measures.":"Jangan masuk atau merentasi sebarang kawasan korekan tanpa kebenaran yang jelas. Kawasan ini mempunyai risiko berpotensi seperti runtuhan, bahan jatuh, dan jatuh. Memasuki adalah dilarang tanpa kebenaran dan langkah keselamatan yang sewajarnya.","Numerous electrical panels are present on site. Do not touch or attempt to operate any electrical equipment. Danger Electrical Hazard signs are clearly displayed on these panels. Only authorized personnel should handle electrical equipment.":"Banyak panel elektrik terdapat di tapak. Jangan sentuh atau cuba mengendalikan sebarang peralatan elektrik. Papan tanda Bahaya Elektrik dipaparkan dengan jelas pada panel ini. Hanya kakitangan yang diberi kuasa boleh mengendalikan peralatan elektrik.","The 9 Life Saving Rules":"9 Life Saving Rules","You must":"Anda mesti","If you are the supervisor / Permit Holder, you must":"Jika anda penyelia / Pemegang Permit, anda mesti","EcoOils Zero Tolerance: choosing to break a Life Saving Rule means choosing not to work for EcoOils.":"Toleransi Sifar EcoOils: memilih untuk melanggar Life Saving Rule bermaksud memilih untuk tidak bekerja dengan EcoOils.","If you have not watched the video, or would like to watch it again, please find the links below.":"Jika anda belum menonton video, atau ingin menontonnya semula, sila gunakan pautan di bawah.","The video opens in a new tab or app. Your progress is saved — come back to this page when it ends.":"Video dibuka dalam tab atau aplikasi baharu. Kemajuan anda disimpan — kembali ke halaman ini apabila video tamat. (Video Bahasa Melayu belum tersedia — sila gunakan video Bahasa Indonesia atau Inggeris.)","I have watched the video and understood the requirements of the <b>${r.name.en}</b> rule":"Saya telah menonton video dan memahami keperluan peraturan <b>${r.name.ms}</b>","A Permit to Work (PTW) is a legal, formal document ensuring hazardous tasks are completed safely. <b>The PTW system applies to work performed on EcoOils premises &amp; sites under the direct control of EcoOils.</b>":"Permit Kerja (PTW) ialah dokumen rasmi yang sah di sisi undang-undang bagi memastikan tugas berbahaya disiapkan dengan selamat. <b>Sistem PTW terpakai untuk kerja yang dilakukan di premis EcoOils &amp; tapak di bawah kawalan langsung EcoOils.</b>","Cold Work":"Kerja Sejuk (Cold Work)","Confined Space Entry":"Memasuki Ruang Terkurung","Lifting":"Pengangkatan","Electrical / High Voltage":"Elektrik / Voltan Tinggi","Excavation":"Korekan","Stop Work Obligation:":"Kewajipan Henti Kerja:","anyone can and should stop work if they see an unsafe situation":"sesiapa sahaja boleh dan harus menghentikan kerja jika mereka melihat keadaan tidak selamat","Be proactive:":"Bersikap proaktif:","engage, encourage, and intervene to promote safety":"libatkan diri, galakkan, dan campur tangan untuk menggalakkan keselamatan","Report all observations:":"Laporkan semua pemerhatian:","use the digital form to report unsafe acts, conditions, or positive safety observations":"gunakan borang digital untuk melaporkan tindakan tidak selamat, keadaan tidak selamat, atau pemerhatian keselamatan yang positif","Mandatory PPE":"PPE Wajib","in all project site areas (except rest shelters):":"di semua kawasan tapak projek (kecuali bangsal rehat):","Helmet w/ chin strap":"Topi keledar dengan tali dagu","Coveralls or Long sleeves & pants":"Pakaian kerja keseluruhan (coverall) atau Lengan panjang & seluar panjang","Hi-vis vest w/ reflector (if wearing clothes without reflectors)":"Vest keterlihatan tinggi dengan pemantul (jika memakai pakaian tanpa pemantul)","Gloves":"Sarung tangan","Steel Toe — Safety shoes/boots":"Kasut/but keselamatan hujung keluli (Steel Toe)","Critical/high-risk activities":"Aktiviti kritikal/berisiko tinggi","requiring extra controls & permits:":"yang memerlukan kawalan & permit tambahan:","Lifting Operations":"Operasi Pengangkatan","Trenching & Excavation":"Penggalian Parit & Korekan","Scaffolding":"Perancah","Electrical Safety & High Voltage":"Keselamatan Elektrik & Voltan Tinggi","<b>Electrical Safety &amp; High Voltage:</b> only a competent, authorized person may work on electrical systems, and a Permit to Work is required. Keep cranes, lifting equipment and vehicles clear of high-voltage power lines at all times — this is a Cold Work permit trigger.":"<b>Keselamatan Elektrik &amp; Voltan Tinggi:</b> hanya orang yang cekap dan diberi kuasa boleh bekerja pada sistem elektrik, dan Permit Kerja diperlukan. Pastikan kren, peralatan pengangkat dan kenderaan sentiasa jauh daripada talian kuasa voltan tinggi pada setiap masa — ini adalah pencetus permit Kerja Sejuk.","\"If you see it, own it, and act on it. If you ignore it, you encourage it.\"":"\"Jika anda nampak, anda bertanggungjawab, dan bertindaklah. Jika anda abaikan, anda menggalakkannya.\"","General safety warnings":"Amaran keselamatan am","Three-Warning System: warnings are tracked with a hole-punch on the ID card and an online log — a third warning results in a site ban":"Sistem Tiga Amaran: amaran dijejaki dengan lubang tebuk pada kad pengenalan dan log dalam talian — amaran ketiga mengakibatkan larangan memasuki tapak","Zero Tolerance: serious violations can mean an immediate site ban, bypassing the warning system":"Toleransi Sifar: pelanggaran serius boleh bermaksud larangan segera memasuki tapak, memintas sistem amaran","Life Saving Rule violations (progressive discipline)":"Pelanggaran Life Saving Rule (disiplin progresif)","First Warning — one punch hole on the ID card":"Amaran Pertama — satu lubang tebuk pada kad pengenalan","Second Warning — two punch holes on the ID card, plus a written self-declaration acknowledging the consequences of a Third Warning":"Amaran Kedua — dua lubang tebuk pada kad pengenalan, serta akuan kendiri bertulis yang mengakui akibat Amaran Ketiga","Third Warning — results in a site ban":"Amaran Ketiga — mengakibatkan larangan memasuki tapak","This mirrors Indonesia's statutory progressive warning-letter procedure — Surat Peringatan I, II, III (SP1, SP2, SP3) — under the Manpower Law (UU No. 13/2003 on Manpower, as amended, Art. 161), which requires successive written warnings before termination for repeated violations.":"Ini mencerminkan prosedur surat amaran progresif berkanun di Indonesia — Surat Peringatan I, II, III (SP1, SP2, SP3) — di bawah Undang-Undang Ketenagakerjaan (UU No. 13/2003 mengenai Ketenagakerjaan, seperti yang dipinda, Perkara 161), yang menghendaki surat amaran bertulis berturut-turut sebelum penamatan bagi pelanggaran berulang.","EcoOils reserves the right to skip steps based on severity. Gross misconduct results in immediate suspension pending investigation, and immediate termination if proven.":"EcoOils berhak melangkau langkah-langkah berdasarkan tahap keterukan. Salah laku berat mengakibatkan penggantungan serta-merta sementara menunggu siasatan, dan penamatan serta-merta jika terbukti.","Lesson from our site":"Pengajaran dari tapak kami","In case of emergency:":"Dalam keadaan kecemasan:","stay calm and move to the designated muster station":"bertenang dan bergerak ke tempat berhimpun (muster station) yang ditetapkan","Feeling unwell:":"Berasa tidak sihat:","inform your supervisor and HSSE immediately":"maklumkan penyelia dan HSSE anda dengan segera","Short lessons from real events on this project.":"Pengajaran ringkas daripada kejadian sebenar di projek ini.","Emergency Contact Card":"Kad Hubungan Kecemasan","GENERAL EMERGENCY":"KECEMASAN AM","HOSPITALS — SEI MANGKEI":"HOSPITAL — SEI MANGKEI","HOSPITALS — MEDAN":"HOSPITAL — MEDAN","Keep this card with you on site":"Simpan kad ini bersama anda semasa di tapak","Official Life-Saving Rule (IOGP)":"Peraturan Life-Saving rasmi (IOGP) — teks rasmi dalam Bahasa Indonesia","How many Life Saving Rules are there?":"Berapakah bilangan Life Saving Rules?","Which of these is one of the 9 Life Saving Rules?":"Yang manakah merupakan salah satu daripada 9 Life Saving Rules?","In an emergency, where do you go after leaving the area?":"Dalam kecemasan, ke manakah anda pergi selepas meninggalkan kawasan itu?","The designated safe zone, to check in for a head count":"Zon selamat yang ditetapkan, untuk mendaftar masuk bagi pengiraan kehadiran","The nearest canteen":"Kantin yang terdekat","Your vehicle":"Kenderaan anda","Back to your work area":"Kembali ke kawasan kerja anda","Who has the Stop Work Obligation?":"Siapakah yang mempunyai Kewajipan Henti Kerja?","Anyone who sees an unsafe situation":"Sesiapa yang melihat keadaan tidak selamat","Only supervisors":"Penyelia sahaja","Only HSSE personnel":"K function msOf(en){ return MSD[en]!==undefined ? MSD[en] : en; }
/* ============ QUESTION BANK (60) ============
   10 MANDATORY slots (each has an A and B version; a candidate sees A first, B on a retry)
   + 40-question random POOL. Each paper = 10 mandatory + 10 random (20 total), shuffled together.
   Random picks: 6 guaranteed (one each from Bypassing, Driving, Energy Isolation, Hot Work, Line of Fire,
   Work Authorisation) + 4 fully random. A candidate never sees the same random question twice.
   Correct answer is listed FIRST in mkc(); options are shuffled at paper-build time. */
const O_ = (en,id)=>({en,id,ms:msOf(en)});
function mkc(id, topic, group, qEn, qId, correct, wrongs){
  return { id, topic, group:group||null, q:{en:qEn,id:qId,ms:msOf(qEn)}, opts:[correct,...wrongs].map(x=>O_(x[0],x[1])), correct:0, fixed:false };
}
function mkf(id, topic, group, qEn, qId, opts, correct){   // fixed order (numbers, True/False)
  return { id, topic, group:group||null, q:{en:qEn,id:qId,ms:msOf(qEn)}, opts:opts.map(x=>O_(x[0],x[1])), correct, fixed:true };
}
function fromLegacy(i, id, topic, group, fixed){
  const L = legacyQ[i]; return { id, topic, group:group||null, q:L.q, opts:L.opts, correct:L.correct, fixed:!!fixed };
}

function shuffleArr(a){ const r=a.slice(); for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; }
function randOf(a){ return a[Math.floor(Math.random()*a.length)]; }
function prepareQ(q){
  let opts = q.opts.map((o,i)=>({o,i}));
  if(!q.fixed) opts = shuffleArr(opts);
  return { id:q.id, q:q.q, opts:opts.map(x=>x.o), correct:opts.findIndex(x=>x.i===q.correct) };
}
const PAPER_SIZE = 20, PASS_PCT = 0.8, GUARANTEED_GROUPS = ['bypass','driving','energy','hotwork','lof','workauth'];
function buildPaper(){
  const seen = loadSeen(), usedIds = new Set(), usedTopics = new Set(), paper = [];
  MANDATORY.forEach(slot=>{
    const unseen = [slot.a, slot.b].filter(q=>!seen.has(q.id));
    const pick = unseen.length ? unseen[0] : randOf([slot.a, slot.b]);
    paper.push(pick); usedIds.add(pick.id); usedTopics.add(pick.topic);
  });
  const pickFrom = (cands)=>{
    let c = cands.filter(q=>!usedIds.has(q.id) && !usedTopics.has(q.topic) && !seen.has(q.id));
    if(!c.length) c = cands.filter(q=>!usedIds.has(q.id) && !usedTopics.has(q.topic));   // pool exhausted: allow a repeat only as a last resort
    if(!c.length) return null;
    const p = randOf(c); paper.push(p); usedIds.add(p.id); usedTopics.add(p.topic); return p;
  };
  GUARANTEED_GROUPS.forEach(g=> pickFrom(POOL.filter(q=>q.group===g)));
  // the 4 fully random picks come only from questions outside the six guaranteed rule groups, so a retry still has a fresh question for every rule
  const freeQs = POOL.filter(q=>!q.group);
  while(paper.length < PAPER_SIZE){ if(!pickFrom(freeQs)) break; }
  while(paper.length < PAPER_SIZE){ if(!pickFrom(POOL)) break; }
  while(paper.length < PAPER_SIZE){ const rest = POOL.filter(q=>!usedIds.has(q.id)); if(!rest.length) break; const p=randOf(rest); paper.push(p); usedIds.add(p.id); }
  paper.forEach(q=>seen.add(q.id)); saveSeen(seen);
  finalQuestions = shuffleArr(paper).map(prepareQ);
  PASS_MARK = Math.ceil(finalQuestions.length * PASS_PCT);
}

/* ---- security check code: worked out from the certificate's own details, so it can be re-checked from the QR without any list or server ---- */
const CODE_ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', CODE_SALT = 'MTR-HSSE|EcoOils|Sei Mangkei|v1';
function normField(s){ return String(s==null?'':s).toUpperCase().replace(/\s+/g,' ').trim(); }
function cyrb53(str, seed){
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for(let i=0, ch; i<str.length; i++){ ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1>>>16), 2246822507); h1 ^= Math.imul(h2 ^ (h2>>>13), 3266489909);
  h2 = Math.imul(h2 ^ (h2>>>16), 2246822507); h2 ^= Math.imul(h1 ^ (h1>>>13), 3266489909);
  return 4294967296 * (2097151 & h2) + (h1>>>0);
}
function deriveCheckCode(cert, name, company, idLast4, score, total){
  const payload = [CODE_SALT, cert, normField(name), normField(company), normField(idLast4), String(score), String(total)].join('|');
  let x = cyrb53(payload, 0x4D54) % 1125899906842624, out = '';       // 50 bits -> 10 characters
  for(let i=0;i<10;i++){ out = CODE_ALPHABET[x % 32] + out; x = Math.floor(x/32); }
  return out;
}

const PHONE_CC = [
  {c:'+62',n:['Indonesia','Indonesia','Indonesia'],min:8,max:11},
  {c:'+60',n:['Malaysia','Malaysia','Malaysia'],min:8,max:10},
  {c:'+91',n:['India','India','India'],min:10,max:10},
  {c:'+65',n:['Singapore','Singapura','Singapura'],min:8,max:8},
  {c:'+86',n:['China','Tiongkok','China'],min:10,max:12},

  {c:'+66',n:['Thailand','Thailand','Thailand'],min:8,max:9}
];
function normalizePhone(cc, raw){
  const bad = {ok:false, e164:'', pretty:''};
  let s = String(raw||'').replace(/[\s().\-]/g,'');
  if(!s) return bad;
  const info = PHONE_CC.find(x=>x.c===cc);
  let digits, intl = false;
  if(s[0]==='+'){ digits = s.slice(1); intl = true; }
  else if(s.slice(0,2)==='00'){ digits = s.slice(2); intl = true; }
  else if(!info){ return bad; }
  else if(s[0]==='0'){ digits = cc.slice(1) + s.slice(1); }
  else if(s.indexOf(cc.slice(1))===0 && s.length > info.max){ digits = s; }
  else { digits = cc.slice(1) + s; }
  if(!/^[0-9]+$/.test(digits)) return bad;
  if(info && digits.indexOf(cc.slice(1))===0){
    let nat = digits.slice(cc.length-1);
    if(nat[0]==='0') nat = nat.slice(1);
    if(nat.length<info.min || nat.length>info.max) return bad;
    digits = cc.slice(1) + nat;
  } else {
    if(!intl || digits.length<8 || digits.length>15 || digits[0]==='0') return bad;
  }
  const known = PHONE_CC.find(x=>digits.indexOf(x.c.slice(1))===0);
  const ccLen = known ? known.c.length-1 : (digits.length>10 ? digits.length-10 : 2);
  const nat = digits.slice(ccLen);
  const grp = [nat.slice(0,3), nat.slice(3,7), nat.slice(7)].filter(Boolean).join(' ');
  return {ok:true, e164:'+'+digits, pretty:'+'+digits.slice(0,ccLen)+' '+grp};
}

function mcuCompress(file){
  return new Promise((res,rej)=>{
    const fr = new FileReader();
    fr.onerror = ()=>rej(new Error('read'));
    fr.onload = ()=>{
      const im = new Image();
      im.onerror = ()=>rej(new Error('img'));
      im.onload = ()=>{
        const max = 1600, k = Math.min(1, max/Math.max(im.width, im.height));
        const c = document.createElement('canvas'); c.width = Math.round(im.width*k); c.height = Math.round(im.height*k);
        const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(im,0,0,c.width,c.height);
        let out = ''; for(const q of [0.78,0.65,0.5]){ out = c.toDataURL('image/jpeg', q); if(out.length < 1500000) break; }
        res(out);
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function mcuReadPdf(file){ return new Promise((res,rej)=>{ const fr = new FileReader(); fr.onerror = ()=>rej(new Error('read')); fr.onload = ()=>res(fr.result); fr.readAsDataURL(file); }); }

async function recordSubmission(){
  if(state.recorded) return; // avoid duplicate rows if user re-renders the result screen
  state.recorded = true;
  const v = state.visitor;
  const completionTime = Date.now();
  const durationMs = state.startTime ? (completionTime - state.startTime) : 0;
  const record = {
    certNumber, verifyCode, name:v.name, company:v.company, idnum:idLast4(), host:v.host, hostName:v.hostName, hostPhone:phoneFull(), videosWatched:videoSummary().n, videoSecs:videoSummary().secs, purpose:v.purpose,

    percentage: Math.round((state.score/finalQuestions.length)*100),
    passed: state.score >= PASS_MARK,
    attemptsTaken: state.attempts + 1,
    startTime: state.startTime ? new Date(state.startTime).toISOString() : "",

    durationSeconds: Math.round(durationMs/1000),
    durationLabel: formatDuration(durationMs),
    lang: state.lang
  };

    if(window.storage){
      const key = `submission:${completionTime}-${Math.floor(Math.random()*10000)}`;
      await window.storage.set(key, JSON.stringify(record), true);
    }
  }catch(e){ console.error('Storage error (record still shown on this device):', e); }
  try{
    if(GOOGLE_SHEET_WEBHOOK_URL){
      queueUpload(record);                      // 1) the small record goes first, so the sheet row never waits for the image
      if(state.mcuDataUrl && v.healthCert==='yes') attachMcu(record.certNumber, state.mcuDataUrl, state.mcuName);
      certToDataUrl().then(img=>attachImage(record.certNumber, img)).catch(e=>{ console.error('Certificate image failed:', e); attachImage(record.certNumber, ''); });   // 2) the image follows when it is ready
    }

}

/* ============ UPLOAD: sheet row first, certificate copy second, kept on the phone until the server confirms ============ */
const UPLOAD_KEY = 'mhi_pending_v2', UPLOAD_KEY_OLD = 'mhi_pending_v1';
let QM = null, uploading = false, retryTimer = null;
async function certToDataUrl(){
  const canvas = await genCertificateCanvas();
  for(const q of [0.8, 0.65, 0.5]){ const u = canvas.toDataURL('image/jpeg', q); if(u.length < 900000) return u; }
  return canvas.toDataURL('image/jpeg', 0.4);
}
function loadQ(){ if(QM===null){ try{ QM = JSON.parse(localStorage.getItem(UPLOAD_KEY)||'[]'); }catch(e){ QM = []; } } return QM; }
function saveQ(list){ QM = list; try{ if(list.length) localStorage.setItem(UPLOAD_KEY, JSON.stringify(list)); else localStorage.removeItem(UPLOAD_KEY); }catch(e){} }   // memory copy keeps working even if the browser blocks storage
function pendingDone(it){ return it.rowDone && (it.imgDone || !it.wantImg) && (it.mcuDone || !it.wantMcu); }
function migrateOldQueue(){          // uploads left waiting by an earlier version of this page on this phone
  try{
    const raw = localStorage.getItem(UPLOAD_KEY_OLD); if(!raw) return;
    const list = loadQ();
    JSON.parse(raw).forEach(p=>{ if(!list.some(x=>x.cn===p.certNumber)){ const rec = Object.assign({}, p); const img = rec.certImage || ''; delete rec.certImage; list.push({cn:p.certNumber, rec, img, wantImg:!!img, rowDone:false, imgDone:false}); } });
    saveQ(list); localStorage.removeItem(UPLOAD_KEY_OLD);
  }catch(e){}
}
function queueUpload(record){
  const list = loadQ().filter(x=>x.cn!==record.certNumber);
  list.push({cn:record.certNumber, rec:record, img:'', wantImg:true, rowDone:false, imgDone:false});
  saveQ(list.slice(-3)); refreshUploadStatus(); runUploads();
}
function attachMcu(cn, data, name){ const list = loadQ(); const it = list.find(x=>x.cn===cn); if(!it) return; it.mcu = data; it.mcuName = name || ''; it.wantMcu = true; it.mcuDone = false; saveQ(list); runUploads(); }
function attachImage(cn, img){ const list = loadQ(); const it = list.find(x=>x.cn===cn); if(!it) return; it.img = img || ''; if(!img) it.wantImg = false; saveQ(list); runUploads(); }
function currentUploadState(){
  const it = loadQ().find(x=>x.cn===certNumber);
  if(!it) return state.recorded ? 'ok' : '';
  if(pendingDone(it)) return 'ok';
  if(it.rowDone) return 'row';
  return it.failed ? 'fail' : 'pending';
}
function uploadStatusText(L, st){ return st==='ok' ? L.upOk : st==='row' ? L.upRow : st==='fail' ? L.upFail : L.upSending; }
function refreshUploadStatus(){
  const st = currentUploadState() || 'pending'; state.uploadStatus = st;
  const el = document.getElementById('uploadStatus'); if(!el) return;
  el.textContent = uploadStatusText(UI[state.lang], st);
  el.style.color = st==='fail' ? 'var(--danger)' : 'var(--green-dark)';
}
async function postOnce(payload){
  const ctrl = new AbortController(); const t = setTimeout(()=>ctrl.abort(), 60000);
  try{
    const res = await fetch(GOOGLE_SHEET_WEBHOOK_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload), signal: ctrl.signal });
    const j = await res.json();
    return (j && j.ok) ? j : null;
  }catch(e){ return null; }
  finally{ clearTimeout(t); }
}
async function runUploads(){
  if(uploading || !GOOGLE_SHEET_WEBHOOK_URL) return;
  migrateOldQueue();
  if(!loadQ().length) return;
  if(typeof navigator!=='undefined' && navigator.onLine===false){            // offline: wait for the 'online' event
    const l = loadQ(); l.forEach(x=>{ if(!x.rowDone) x.failed = true; }); saveQ(l); refreshUploadStatus(); return;

    const list = loadQ();

        const r = await postOnce(it.rec);
        if(r && (r.rowSaved===undefined ? true : r.rowSaved)){ it.rowDone = true; it.failed = false; } else { it.failed = true; }
        saveQ(list); refreshUploadStatus();
      }
      if(it.rowDone && it.wantImg && it.img && !it.imgDone){
        const r = await postOnce(Object.assign({}, it.rec, {certImage: it.img}));
        if(r && (r.imageSaved===undefined ? !!r.link : r.imageSaved)) it.imgDone = true;
        saveQ(list); refreshUploadStatus();
      }
      if(it.rowDone && it.wantMcu && it.mcu && !it.mcuDone){
        const r = await postOnce(Object.assign({}, it.rec, {mcuImage: it.mcu, mcuName: it.mcuName}));
        if(r && r.mcuSaved) it.mcuDone = true;
        saveQ(list); refreshUploadStatus();
      }
    }
    saveQ(list.filter(it=>!pendingDone(it)));
    refreshUploadStatus();
  } finally { uploading = false; }
  if(loadQ().some(it=>!pendingDone(it))){ clearTimeout(retryTimer); retryTimer = setTimeout(runUploads, 20000); }
}

function recordsToCSV(records){
  const headers = ["Certificate No","Name","Company","ID/Passport (last 4)","Host/Contractor","Host Contact Name","Host Contact Phone","Purpose","Details Certified","Health Cert Submitted","Score","Total Questions","Percentage","Passed","Attempts Taken","Start Time","Completion Time","Duration"];
  const rows = records.map(r=>[
    r.certNumber, r.name, r.company, r.idnum, r.host, r.hostName, r.hostPhone, r.purpose,
    r.certify ? "Yes" : "No", r.healthCert==='yes' ? "Yes" : (r.healthCert==='no' ? "No" : ""),
    r.score, r.totalQuestions, r.percentage+"%", r.passed ? "Pass" : "Fail", r.attemptsTaken ?? "",
    r.startTime, r.completionTime, r.durationLabel
  ]);
  const esc = (val)=>{ const s = String(val ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
  return [headers, ...rows].map(row=>row.map(esc).join(",")).join("\r\n");
}
async function exportRecordsCSV(){
  const L = UI[state.lang];
  try{
    if(!window.storage){ alert(L.adminExportEmpty); return; }
    const listRes = await window.storage.list('submission:', true);
    const keys = (listRes && listRes.keys) || [];
    if(!keys.length){ alert(L.adminExportEmpty); return; }
    const records = [];
    for(const k of keys){
      try{ const r = await window.storage.get(k, true); if(r && r.value) records.push(JSON.parse(r.value)); }catch(e){}
    }
    records.sort((a,b)=> new Date(a.completionTime) - new Date(b.completionTime));
    const csv = recordsToCSV(records);
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `mentari-hsse-induction-records-${Date.now()}.csv`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);

}

async function startVerify(){
  if(VERIFY_D && !VERIFY_LOCAL_OK){ verifyState = { phase:'bad', data:null, started:true }; render(); return; }      // details or code were changed: no network needed
  verifyState = VERIFY_LOCAL_OK ? { phase:'local', data:null, reg:'checking', started:true } : { phase:'checking', data:null, started:true };
  if(VERIFY_LOCAL_OK) render();
  const ctrl = new AbortController(); const t = setTimeout(()=>ctrl.abort(), 25000);
  try{
    const res = await fetch(GOOGLE_SHEET_WEBHOOK_URL + '?cert=' + encodeURIComponent(VERIFY_V) + '&code=' + encodeURIComponent(VERIFY_C) + '&f=json', { signal: ctrl.signal });
    const j = await res.json();
    if(VERIFY_LOCAL_OK){
      verifyState = (j && j.ok && j.verified) ? { phase:'ok', data:j, started:true } : { phase:'local', data:null, reg:(j && j.ok) ? 'missing' : 'offline', started:true };
    } else {
      verifyState = (j && j.ok) ? (j.verified ? { phase:'ok', data:j, started:true } : { phase:'bad', data:null, started:true }) : { phase:'offline', data:null, started:true };
    }
  }catch(e){ verifyState = VERIFY_LOCAL_OK ? { phase:'local', data:null, reg:'offline', started:true } : { phase:'offline', data:null, started:true }; }
  finally{ clearTimeout(t); }
  render();
}

function vidId(url){ const m = String(url).match(/youtu\.be\/([\w-]{6,})/) || String(url).match(/[?&]v=([\w-]{6,})/); return m ? m[1] : ''; }
function watchRec(id){ state.lsrWatch = state.lsrWatch || {}; return state.lsrWatch[id] || (state.lsrWatch[id] = {sec:0, dur:0, mode:'', clicked:false, t0:0}); }
function recDone(w){ return !!w && ((w.dur>0 && w.sec >= w.dur*WATCH_PCT) || (w.mode==='fallback' && w.clicked && w.t0 && (Date.now()-w.t0)/1000 >= FALLBACK_SECS)); }
function watchDone(key){
  if(typeof isAdminMode!=='undefined' && isAdminMode) return true;
  const L = LSR_VIDEO_LINKS[key]; if(!L) return true;
  const ws = state.lsrWatch || {};
  return [vidId(L.en), vidId(L.id)].some(id => recDone(ws[id]));
}
function videoSummary(){
  let n = 0, secs = 0;
  lsrData.forEach(r=>{ const L = LSR_VIDEO_LINKS[r.key], ws = state.lsrWatch || {}; if(watchDone(r.key)) n++;
    secs += Math.max(...[vidId(L.en), vidId(L.id)].map(id => (ws[id] && ws[id].sec) || 0)); });
  return { n, secs: Math.round(secs) };
}
function fmtClock(s){ s = Math.max(0, Math.round(s)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }

let vidTimer = null, vidPlayer = null, vidApiP = null;
function stopVideoGate(){
  try{ if(window.__vidFsOff) window.__vidFsOff(); }catch(e){}
  if(vidTimer){ clearInterval(vidTimer); vidTimer = null; }
  try{ if(vidPlayer && vidPlayer.destroy) vidPlayer.destroy(); }catch(e){}
  vidPlayer = null;
}
function loadYT(){
  if(window.YT && window.YT.Player) return Promise.resolve();
  if(vidApiP) return vidApiP;
  vidApiP = new Promise((res,rej)=>{
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = ()=>{ try{ if(prev) prev(); }catch(e){} res(); };
    const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; s.onerror = ()=>{ vidApiP = null; rej(new Error('yt')); };
    document.head.appendChild(s);
    setTimeout(()=>{ if(!(window.YT && window.YT.Player)){ vidApiP = null; rej(new Error('timeout')); } }, 10000);
  });
  return vidApiP;
}
function initVideoGate(key, onUnlock){
  stopVideoGate();
  const root = document.getElementById('vidGate'); if(!root) return;
  const lang = state.lang, L = LSR_VIDEO_LINKS[key];
  const ids = { en: vidId(L.en), id: vidId(L.id) };
  let cur = (state.lsrPick && state.lsrPick[key]) || (lang==='en' ? 'en' : 'id');
  const cb = document.getElementById('confirmGateInput'), bar = document.getElementById('vidBar'), txt = document.getElementById('vidTxt');
  const playBtn = document.getElementById('vidPlay'), wait = document.getElementById('vidWait'), fb = document.getElementById('vidFallback');
  let last = null, tick = 0, fell = false;
  const refresh = ()=>{
    const done = watchDone(key);
    const w = watchRec(ids[cur]);
    if(w.mode==='fallback' && !done){
      const left = Math.max(0, FALLBACK_SECS - (w.clicked && w.t0 ? (Date.now()-w.t0)/1000 : 0));
      bar.style.width = (w.clicked ? Math.min(100, 100*(FALLBACK_SECS-left)/FALLBACK_SECS) : 0) + '%';
      txt.textContent = !w.clicked ? T3(lang,'Open one of the videos above to start the timer.','Buka salah satu video di atas untuk memulai penghitung waktu.','Buka salah satu video di atas untuk memulakan pemasa.')
        : T3(lang,`Continue unlocks in ${fmtClock(left)}`,`Lanjut terbuka dalam ${fmtClock(left)}`,`Teruskan dibuka dalam ${fmtClock(left)}`);
    } else if(done){
      bar.style.width = '100%';
      txt.innerHTML = '<b style="color:var(--green-dark);">✓ ' + T3(lang,'Video watched. You can tick the box and continue.','Video selesai ditonton. Centang kotak dan lanjutkan.','Video selesai ditonton. Tandakan kotak dan teruskan.') + '</b>';
    } else {
      const need = w.dur ? w.dur*WATCH_PCT : 0;
      bar.style.width = need ? Math.min(100, 100*w.sec/need) + '%' : '0%';
      txt.textContent = w.dur ? T3(lang,`Watched ${fmtClock(w.sec)} of ${fmtClock(w.dur)} — the video must play through`,`Ditonton ${fmtClock(w.sec)} dari ${fmtClock(w.dur)} — video harus diputar sampai selesai`,`Ditonton ${fmtClock(w.sec)} daripada ${fmtClock(w.dur)} — video mesti dimainkan sehingga habis`) : '';
    }
    if(cb){ if(done){ cb.disabled = false; } else { cb.disabled = true; if(cb.checked){ cb.checked = false; state.lsrConfirmed[state.lsrCurIdx] = false; if(onUnlock) onUnlock(false); } } }
    if(fsTxt) fsTxt.textContent = txt.textContent;
    document.getElementById('vidLangEn').style.outline = cur==='en' ? '3px solid var(--green)' : 'none';
    document.getElementById('vidLangId').style.outline = cur==='id' ? '3px solid var(--green)' : 'none';
  };
  const fallback = ()=>{
    if(fell) return; fell = true; stopVideoGate();
    wait.style.display = 'none'; fb.style.display = 'block'; playBtn.style.display = 'none'; fsBtn.style.display = 'none'; fsOff();
    ['en','id'].forEach(k=>{ const w = watchRec(ids[k]); if(!w.dur || w.sec < w.dur*WATCH_PCT) w.mode = 'fallback'; });
    root.querySelectorAll('.vidExt').forEach(a=>{ a.addEventListener('click', ()=>{ ['en','id'].forEach(k=>{ const w = watchRec(ids[k]); if(w.mode==='fallback' && !w.clicked){ w.clicked = true; w.t0 = Date.now(); } }); saveProgress(); refresh(); }); });
    vidTimer = setInterval(()=>{ refresh(); if(watchDone(key)){ clearInterval(vidTimer); vidTimer = null; saveProgress(); } }, 1000);
    refresh();
  };
  const startPlayer = ()=>{
    if(fell) return; stopVideoGate(); last = null;
    const box = document.getElementById('vidBox'); if(!box) return;
    box.innerHTML = '<div id="vidMount"></div>'; wait.style.display = 'flex'; wait.textContent = T3(lang,'Loading video…','Memuat video…','Memuatkan video…'); playBtn.disabled = true;
    try{
      vidPlayer = new YT.Player('vidMount', { videoId: ids[cur], width:'100%', height:'100%',
        host: 'https://www.youtube-nocookie.com',
        playerVars: { controls:0, disablekb:1, rel:0, modestbranding:1, playsinline:1, iv_load_policy:3, fs:0 },
        events: {
          onReady: ()=>{ wait.style.display = 'none'; playBtn.disabled = false; fsBtn.disabled = false; refresh(); },
          onError: ()=>fallback(),
          onStateChange: (ev)=>{ if(ev.data===0){ tickFn(true); refresh(); } }
        } });
    }catch(e){ fallback(); return; }
    vidTimer = setInterval(()=>tickFn(false), 500);
  };
  const tickFn = (force)=>{
    const p = vidPlayer; if(!p || !p.getPlayerState) return;
    let st; try{ st = p.getPlayerState(); }catch(e){ return; }
    const w = watchRec(ids[cur]);
    try{ const d = p.getDuration(); if(d > 0) w.dur = d; }catch(e){}
    if(st === 1 && document.visibilityState === 'visible'){
      let rate = 1; try{ rate = p.getPlaybackRate(); }catch(e){}
      if(rate !== 1){ try{ p.setPlaybackRate(1); }catch(e){} last = null; }
      else {
        const t = p.getCurrentTime();
        if(last !== null){ const d = t - last; if(d > 0 && d <= 1.6) w.sec += d; }
        last = t;
      }
    } else { last = null; }
    if(st === 0 && w.dur && !recDone(w)){ /* ended without enough real play time: the clip was skipped through */ }
    if(++tick % 10 === 0) saveProgress();
    const wasDone = cb && !cb.disabled;
    refresh();
    if(!wasDone && watchDone(key)){ saveProgress(); }
  };

  const wrap = document.getElementById('vidWrap'), fsBar = document.getElementById('vidFsBar'), fsTxt = document.getElementById('vidFsTxt'), fsBtn = document.getElementById('vidFs');
  let fsOn = false, swapping = false;
  const layoutFS = ()=>{
    if(!fsOn) return;
    const W = window.innerWidth, H = window.innerHeight;
    Object.assign(wrap.style, {position:'fixed', zIndex:'9999', background:'#000', borderRadius:'0', paddingTop:'0', left:'0', top:'0', overflow:'hidden'});
    if(W < H){ wrap.style.width = H+'px'; wrap.style.height = W+'px'; wrap.style.transformOrigin = '0 0'; wrap.style.transform = 'translateX('+W+'px) rotate(90deg)'; }
    else { wrap.style.width = W+'px'; wrap.style.height = H+'px'; wrap.style.transform = 'none'; }
  };
  const fsOff = ()=>{
    if(!fsOn) return; fsOn = false;
    Object.assign(wrap.style, {position:'relative', zIndex:'', background:'#0b1f14', borderRadius:'10px', paddingTop:'56.25%', left:'', top:'', width:'100%', height:'', transform:'none'});
    fsBar.style.display = 'none'; document.body.style.overflow = '';
    try{ if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen(); else if(document.webkitFullscreenElement && document.webkitExitFullscreen) document.webkitExitFullscreen(); }catch(e){}
    try{ if(screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); }catch(e){}
    window.removeEventListener('resize', layoutFS); window.removeEventListener('orientationchange', layoutFS);
  };
  window.__vidFsOff = fsOff;
  const fsOnFn = ()=>{
    if(fsOn) return; fsOn = true; document.body.style.overflow = 'hidden'; fsBar.style.display = 'flex';
    layoutFS(); window.addEventListener('resize', layoutFS); window.addEventListener('orientationchange', layoutFS);
    try{ const rq = wrap.requestFullscreen || wrap.webkitRequestFullscreen; if(rq){ const r = rq.call(wrap); if(r && r.then) r.then(()=>{
          let locked = Promise.resolve();
          try{ locked = screen.orientation.lock('landscape'); }catch(e){ locked = Promise.reject(e); }
          const settle = ()=>{ layoutFS(); if(fsOn && window.innerWidth < window.innerHeight && document.fullscreenElement){ swapping = true; try{ document.exitFullscreen(); }catch(e){} setTimeout(()=>{ swapping = false; layoutFS(); }, 400); } };
          Promise.resolve(locked).then(()=>setTimeout(settle,500), ()=>setTimeout(settle,50));
        }).catch(()=>{}); } }catch(e){}
  };
  document.addEventListener('fullscreenchange', ()=>{ if(!document.fullscreenElement && fsOn && !swapping) fsOff(); });
  fsBtn.onclick = fsOnFn;
  document.getElementById('vidFsExit').onclick = fsOff;
  document.getElementById('vidFsPlay').onclick = ()=>playBtn.click();
  playBtn.onclick = ()=>{ try{ if(!vidPlayer) return; const s = vidPlayer.getPlayerState(); if(s===1) vidPlayer.pauseVideo(); else vidPlayer.playVideo(); }catch(e){} };
  document.getElementById('vidLangEn').onclick = ()=>{ if(cur==='en') return; cur='en'; (state.lsrPick = state.lsrPick||{})[key]='en'; if(!fell) startPlayer(); refresh(); };
  document.getElementById('vidLangId').onclick = ()=>{ if(cur==='id') return; cur='id'; (state.lsrPick = state.lsrPick||{})[key]='id'; if(!fell) startPlayer(); refresh(); };
  refresh();
  loadYT().then(startPlayer).catch(()=>fallback());
}

function wrapLines(ctx, text, maxW){
  const words = String(text).split(' '); const lines = []; let line = '';
  words.forEach(w=>{ const t = line ? line+' '+w : w; if(ctx.measureText(t).width > maxW && line){ lines.push(line); line = w; } else { line = t; } });
  if(line) lines.push(line); return lines;
}

function dataUrlToBytes(u){ const b=atob(u.split(',')[1]); const a=new Uint8Array(b.length); for(let i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a; }
function triggerFileDownload(bytes, filename, type){
  const blob=new Blob([bytes],{type}); const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=filename; a.click(); setTimeout(()=>URL.revokeObjectURL(url),1500);
}
function makePdf(jpgs, pxW, pxH){                 // minimal PDF: one JPEG image per page, no external library
  const enc=new TextEncoder(), chunks=[], offs=[]; let len=0;
  const push=d=>{ const u=typeof d==='string' ? enc.encode(d) : d; chunks.push(u); len+=u.length; };
  const W=pxW*0.5, H=pxH*0.5, n=jpgs.length;
  const obj=(num,body)=>{ offs[num]=len; push(num+' 0 obj\n'+body+'\nendobj\n'); };
  push('%PDF-1.4\n');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,'<< /Type /Pages /Kids ['+jpgs.map((_,i)=>(3+3*i)+' 0 R').join(' ')+'] /Count '+n+' >>');
  jpgs.forEach((j,i)=>{
    const pg=3+3*i, ct=4+3*i, im=5+3*i, cs='q '+W+' 0 0 '+H+' 0 0 cm /Im0 Do Q';
    obj(pg,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+H+'] /Resources << /XObject << /Im0 '+im+' 0 R >> >> /Contents '+ct+' 0 R >>');
    obj(ct,'<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream');
    offs[im]=len; push(im+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+pxW+' /Height '+pxH+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+j.length+' >>\nstream\n'); push(j); push('\nendstream\nendobj\n');
  });
  const xrefAt=len, total=2+3*n; let x='xref\n0 '+(total+1)+'\n0000000000 65535 f \n';
  for(let k=1;k<=total;k++) x+=String(offs[k]).padStart(10,'0')+' 00000 n \n';
  push(x+'trailer\n<< /Size '+(total+1)+' /Root 1 0 R >>\nstartxref\n'+xrefAt+'\n%%EOF\n');
  const out=new Uint8Array(len); let pos=0; chunks.forEach(c=>{ out.set(c,pos); pos+=c.length; }); return out;
}
async function renderBookletCover(lang, pxW, pxH, scale){

  ctx.fillStyle='#F5C518'; ctx.font="600 12.5px Poppins, sans-serif"; ctx.fillText(T.keep, cw/2, H-margin-footH/2-3);
  ctx.fillStyle='#FFFFFF'; ctx.font="500 11px Inter, sans-serif"; ctx.fillText(T.brand, cw/2, H-margin-footH/2+15);
  ctx.textAlign='left'; ctx.restore(); return c;
}
async function buildBookletPdf(){
  const lang = state.lang==='ms' ? 'id' : state.lang, scale = 1.5, COVER_H = 850;
  const cards = []; for(const r of lsrData) cards.push(await renderLsrCard(r.key, scale));
  const pxW = cards[0].width, pxH = Math.max(Math.round(COVER_H*scale), ...cards.map(c=>c.height));

  cards.forEach(card=>{ const p=document.createElement('canvas'); p.width=pxW; p.height=pxH; const x=p.getContext('2d');
    x.fillStyle='#EEF2EC'; x.fillRect(0,0,pxW,pxH); x.drawImage(card, 0, Math.round((pxH-card.height)/2)); pages.push(p); });
  return makePdf(pages.map(pg=>dataUrlToBytes(pg.toDataURL('image/jpeg',0.8))), pxW, pxH);

}
function wrapCenteredText(ctx, text, cx, startY, maxWidth, lineHeight){

    const previewEl = document.getElementById('selfiePreview');
    const canvasEl = document.getElementById('selfieCanvas');
    const captureBtn = document.getElementById('selfieCaptureBtn');
    const retakeBtn = document.getElementById('selfieRetakeBtn');
    const continueBtn = document.getElementById('selfieContinueBtn');
    const retryBtn = document.getElementById('selfieRetryBtn');
    const errorEl = document.getElementById('selfieError');
    const consentCheck = document.getElementById('selfieConsentCheck');
    let stream = null;

    function stopStream(){ if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } }

    function startCamera(){
      if(errorEl) errorEl.style.display='none';
      if(retryBtn) retryBtn.style.display='none';
      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
        if(errorEl) errorEl.style.display='block';
        if(retryBtn) retryBtn.style.display='block';
        return;
      }
      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio:false }).then(s=>{
        stream = s;
        if(videoEl) videoEl.srcObject = s;
      }).catch(()=>{
        if(errorEl) errorEl.style.display='block';
        if(retryBtn) retryBtn.style.display='block';
      });
    }
    // Camera access is only requested after the consent checkbox is explicitly ticked — never before.
    if(state.selfieConsent && !state.selfieDataUrl) startCamera();

    if(consentCheck) consentCheck.onchange = ()=>{
      state.selfieConsent = consentCheck.checked;
      if(!consentCheck.checked){ state.selfieDataUrl = null; } // withdrawing consent discards any captured photo too
      render();
    };
    if(retryBtn) retryBtn.onclick = startCamera;
    if(captureBtn) captureBtn.onclick = ()=>{
      if(!videoEl || !videoEl.videoWidth) return;
      canvasEl.width = videoEl.videoWidth; canvasEl.height = videoEl.videoHeight;
      const ctx = canvasEl.getContext('2d');
      ctx.translate(canvasEl.width,0); ctx.scale(-1,1); // un-mirror so the saved photo reads correctly
      ctx.drawImage(videoEl, 0, 0, canvasEl.width, canvasEl.height);
      state.selfieDataUrl = canvasEl.toDataURL('image/jpeg', 0.9);
      stopStream();
      render();
    };
    if(retakeBtn) retakeBtn.onclick = ()=>{ state.selfieDataUrl = null; render(); };
    if(continueBtn) continueBtn.onclick = ()=>{
      stopStream();
      certNumber = genCertNumber(); verifyCode = genVerifyCode(); recordSubmission();
      state.pos = flow.findIndex(x=>x.type==='result');
      render();
    };
  }

  if(f.type==='result'){
    const resitBtn = document.getElementById('resitBtn');
    if(resitBtn) resitBtn.onclick = ()=>{
      if(autoRestartTimer){ clearTimeout(autoRestartTimer); autoRestartTimer=null; }
      state.qIndex=0; state.score=0; state.qAnswers={}; state.secAnswers={}; state.lsrConfirmed={}; state.lsrWatch={}; state.lsrPick={}; state.selfieDataUrl=null; state.mcuDataUrl=null; state.mcuName=''; state.selfieConsent=false; state.paperBuilt=false;
      state.pos = flow.findIndex(x=>x.type==='content');
      render();
    };
    if(resitBtn && state.score < PASS_MARK){
      autoRestartTimer = setTimeout(()=>{ if(resitBtn) resitBtn.click(); }, 6000);
    }
    const dlCertBtn = document.getElementById('dlCertBtn');
    if(dlCertBtn) dlCertBtn.onclick = downloadCertPNG;
    const shareCertBtn = document.getElementById('shareCertBtn');
    if(shareCertBtn) shareCertBtn.onclick = shareCertPNG;
    if(state.score >= PASS_MARK && !state.certAutoDownloaded){
      state.certAutoDownloaded = true;
      downloadCertPNG().then(()=>{
        const note = document.getElementById('certSavedNote');
        if(note) note.style.display = 'block';
      });
    }
    const restartBtn = document.getElementById('restartBtn');
    if(restartBtn) restartBtn.onclick = ()=>{
      state.paperBuilt=false; state.seenIds=[]; state.bookletSaved=false; state.uploadStatus=''; state.pos=0; state.qIndex=0; state.score=0; state.attempts=0; state.qAnswers={}; state.secAnswers={}; state.lsrConfirmed={}; state.lsrWatch={}; state.lsrPick={};
      state.visitor={name:"",company:"",host:"",hostName:"",hostPhone:"",cc:"+62",idnum:"",purpose:"",certify:false,healthCert:""}; certNumber=""; state.startTime=0; state.recorded=false; state.certAutoDownloaded=false; state.selfieDataUrl=null; state.mcuDataUrl=null; state.mcuName=''; state.selfieConsent=false;
      render();
    };
  }
}

/* ============ KEEP PROGRESS WHEN THE PAGE IS REFRESHED (pull-down, reload, tab restored) ============ */
document.getElementById('verTag').textContent = 'v15';

/* ---- fit the card to whatever screen it is on (phone, laptop, big/extended screen) ---- */
(function(){
  var host=document.getElementById('cardHost'); if(!host) return;
  var busy=false;
  function fit(){
    if(busy) return; busy=true;
    try{
      var pn=host.querySelector('.panel'), ft=host.querySelector('.foot');
      if(!pn){ return; }
      pn.style.maxHeight='none';
      if(!ft){ return; }
      var ratio=ft.offsetHeight? ft.getBoundingClientRect().height/ft.offsetHeight : 1; if(!ratio||!isFinite(ratio)) ratio=1;
      var over=(ft.getBoundingClientRect().bottom+18)-window.innerHeight;
      if(over>0){ pn.style.maxHeight=Math.max(170, Math.floor(pn.offsetHeight-over/ratio))+'px'; }
    }catch(e){} finally{ busy=false; }
  }
  var t=null; function soon(){ clearTimeout(t); t=setTimeout(fit,30); }
  try{ new MutationObserver(soon).observe(host,{childList:true}); }catch(e){}
  window.addEventListener('resize',soon); window.addEventListener('orientationchange',soon);
  document.addEventListener('fullscreenchange',soon);
  soon();
})();
const SAVE_KEY = 'mhi_progress_v1', BUILD_ID = '2026-10-v15-ms', SAVE_MAX_AGE = 6*3600*1000;
const LOCAL_SAVE_KEY = 'mhi_progress_local_v1', LOCAL_MAX_AGE = 3*3600*1000;
let resumeOffer = null;
function saveProgress(){
  if(isAdminMode || resumeOffer || VERIFY_MODE) return;
  const snap = (withSelfie)=>JSON.stringify({ build:BUILD_ID, t:Date.now(), certNumber, verifyCode, PASS_MARK, finalQuestions,
    state:Object.assign({}, state, withSelfie ? {} : {selfieDataUrl:null}, {mcuDataUrl:null, mcuName:''}) });
  try{ sessionStorage.setItem(SAVE_KEY, snap(true)); }
  catch(e){ try{ sessionStorage.setItem(SAVE_KEY, snap(false)); }catch(e2){} }   // storage full: keep progress, drop the photo
  // second copy on this phone, for when the browser (or an in-app browser) drops the tab while a video is open
  try{
    const f = flow[state.pos];
    if(f && f.type==='result'){ localStorage.removeItem(LOCAL_SAVE_KEY); }          // finished: nothing left to resume
    else if(state.pos >= 2){ try{ localStorage.setItem(LOCAL_SAVE_KEY, snap(true)); }catch(e){ localStorage.setItem(LOCAL_SAVE_KEY, snap(false)); } }
  }catch(e){}
}
function applySnap(snap){
  Object.assign(state, snap.state);
  if(state.visitor) state.visitor.idnum = String(state.visitor.idnum||'').replace(/[^A-Za-z0-9]/g,'').toUpperCase().slice(-4);   // an older saved draft may hold a full number: keep only the last 4
  certNumber = snap.certNumber || ''; verifyCode = snap.verifyCode || ''; finalQuestions = snap.finalQuestions || []; PASS_MARK = snap.PASS_MARK || PASS_MARK;
}
function validSnap(snap){ return !!(snap && snap.build===BUILD_ID && snap.state && snap.state.pos < flow.length); }
function maskName(n){ n = String(n||'').trim(); return n ? n.charAt(0)+'•••' : '—'; }
function viewResumeOffer(snap){
  const v = snap.state.visitor || {}; const id = String(v.idnum||''); const idm = id.length>2 ? ' · ••••'+id.slice(-2) : '';
  return `<div class="panel"><div class="eyebrow">EcoOils — Mentari Project</div><h2>Continue your induction? / Lanjutkan induksi Anda?</h2>
    <p class="desc"><b>${maskName(v.name)}${idm}</b><br>An induction is in progress on this phone. / Ada induksi yang sedang berjalan di ponsel ini.</p></div>
    <div class="foot"><button class="btn btn-ghost" id="resumeNewBtn">Start new / Mulai baru</button><button class="btn btn-primary" id="resumeContinueBtn">Continue / Lanjutkan</button></div>`;
}
function loadProgress(){
  if(isAdminMode || VERIFY_MODE) return;
  try{                                                   // 1) same tab reloaded: restore silently
    const raw = sessionStorage.getItem(SAVE_KEY);
    if(raw){ const snap = JSON.parse(raw); if(validSnap(snap) && Date.now()-snap.t <= SAVE_MAX_AGE){ applySnap(snap); return; } sessionStorage.removeItem(SAVE_KEY); }
  }catch(e){ try{ sessionStorage.removeItem(SAVE_KEY); }catch(e2){} }
  try{                                                   // 2) tab was dropped (e.g. after a YouTube app): offer to continue
    const raw = localStorage.getItem(LOCAL_SAVE_KEY);
    if(raw){ const snap = JSON.parse(raw); if(validSnap(snap) && snap.state.pos >= 2 && Date.now()-snap.t <= LOCAL_MAX_AGE){ resumeOffer = snap; return; } localStorage.removeItem(LOCAL_SAVE_KEY); }
  }catch(e){ try{ localStorage.removeItem(LOCAL_SAVE_KEY); }catch(e2){} }
}
// typed answers on the details form are saved as they are typed, and again when the page is hidden or closed
document.addEventListener('input', saveProgress); document.addEventListener('change', saveProgress);
window.addEventListener('pagehide', saveProgress);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') saveProgress(); });

loadProgress();
render();
flushPending();
</script>
